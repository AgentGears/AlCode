name: Tmp Phase 0.7 Receipt Determinism
on:
  push:
    branches:
      - phase-0.7/governed-selective-context
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-0.7/governed-selective-context
      - name: Tighten deterministic receipt evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/host-runtime/src/context-service.ts')
          s = p.read_text()
          s = s.replace('compilerVersion: effectiveMode,', 'compilerVersion: this.requestedMode === "graph" ? "graph-v1" : "verbatim-v1",', 1)
          p.write_text(s)

          p = Path('packages/context/src/context.test.ts')
          s = p.read_text()
          needle = 'expect(a.receipt.source.requestEnvironmentDigest).toBe(b.receipt.source.requestEnvironmentDigest);'
          if needle not in s:
              raise SystemExit('determinism assertion anchor not found')
          s = s.replace(needle, needle + '\n    expect(a.receipt).toEqual(b.receipt);', 1)
          p.write_text(s)
          PY
      - name: Commit if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/host-runtime/src/context-service.ts packages/context/src/context.test.ts
          git commit -m "phase 0.7: tighten deterministic receipt contract"
          git push origin HEAD:phase-0.7/governed-selective-context
