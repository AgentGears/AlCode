name: Phase 0.8 diagnostics

on:
  push:
    branches: [phase-0.8-implementation]
    paths:
      - .github/workflows/phase-0.8-diagnostics.yml

permissions:
  contents: read

jobs:
  diagnose-gate-01b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Diagnose Phase 0.1B gate
        shell: bash
        run: |
          set +e
          out=$(pnpm gate:0.1B 2>&1); code=$?
          printf '%s\n' "$out"
          if [ $code -ne 0 ]; then while IFS= read -r line; do echo "::error::$line"; done <<< "$out"; fi
          exit $code
