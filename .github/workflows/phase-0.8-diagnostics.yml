name: Phase 0.8 diagnostics

on:
  push:
    branches: [phase-0.8-implementation]
    paths:
      - .github/workflows/phase-0.8-diagnostics.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Diagnose foundation + 0.8
        shell: bash
        run: |
          set +e
          for cmd in "pnpm gate:0.1B" "pnpm gate:0.5" "pnpm gate:0.8"; do
            echo "=== $cmd ==="
            out=$(eval "$cmd" 2>&1); code=$?
            printf '%s\n' "$out"
            if [ $code -ne 0 ]; then
              while IFS= read -r line; do
                case "$line" in
                  *"[FAIL]"*|*"error TS"*|*"FAIL "*|*"AssertionError"*|*"expected"*"received"*) echo "::error::$line" ;;
                esac
              done <<< "$out"
            fi
          done
          exit 0
