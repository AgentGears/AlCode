name: Phase 0.8 diagnostics

on:
  push:
    branches: [phase-0.8-implementation]
    paths:
      - .github/workflows/phase-0.8-diagnostics.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reproduce CI Phase 0.0 then 0.1A
        continue-on-error: true
        env:
          ALCODE_HOME: ${{ runner.temp }}/alcode-home
        shell: bash
        run: |
          set +e
          pnpm gate:0.0 >/tmp/g00.log 2>&1
          out=$(pnpm gate:0.1A 2>&1); code=$?
          printf '%s\n' "$out"
          if [ $code -ne 0 ]; then
            while IFS= read -r line; do
              case "$line" in
                *"[FAIL]"*|*"error TS"*|*"AssertionError"*|*"FAIL "*) echo "::error::$line" ;;
              esac
            done <<< "$out"
          fi
          exit $code
      - name: Reproduce Phase 0.8 CI on clean ALCODE_HOME
        continue-on-error: true
        env:
          ALCODE_HOME: ${{ runner.temp }}/alcode-home-08
        shell: bash
        run: |
          set +e
          out=$(pnpm gate:0.8 2>&1); code=$?
          printf '%s\n' "$out"
          if [ $code -ne 0 ]; then
            while IFS= read -r line; do
              case "$line" in
                *"[FAIL]"*|*"error TS"*|*"AssertionError"*|*"FAIL "*) echo "::error::$line" ;;
              esac
            done <<< "$out"
          fi
          exit $code
