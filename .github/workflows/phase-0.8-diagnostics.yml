name: Phase 0.8 diagnostics

on:
  push:
    branches: [phase-0.8-implementation]
    paths:
      - .github/workflows/phase-0.8-diagnostics.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck application protocol
        continue-on-error: true
        shell: bash
        run: |
          set +e
          out=$(pnpm --filter @alcode/application-protocol typecheck 2>&1); code=$?
          printf '%s\n' "$out"
          if [ $code -ne 0 ]; then while IFS= read -r line; do echo "::error::$line"; done <<< "$out"; fi
          exit $code
      - name: Typecheck Host runtime
        continue-on-error: true
        shell: bash
        run: |
          set +e
          out=$(pnpm --filter @alcode/host-runtime typecheck 2>&1); code=$?
          printf '%s\n' "$out"
          if [ $code -ne 0 ]; then while IFS= read -r line; do echo "::error::$line"; done <<< "$out"; fi
          exit $code
      - name: Typecheck web
        continue-on-error: true
        shell: bash
        run: |
          set +e
          out=$(pnpm --filter @alcode/web typecheck 2>&1); code=$?
          printf '%s\n' "$out"
          if [ $code -ne 0 ]; then while IFS= read -r line; do echo "::error::$line"; done <<< "$out"; fi
          exit $code
      - name: Typecheck coding-agent
        continue-on-error: true
        shell: bash
        run: |
          set +e
          out=$(pnpm --filter @alcode/coding-agent typecheck 2>&1); code=$?
          printf '%s\n' "$out"
          if [ $code -ne 0 ]; then while IFS= read -r line; do echo "::error::$line"; done <<< "$out"; fi
          exit $code
      - name: Test coding-agent
        continue-on-error: true
        shell: bash
        run: |
          set +e
          out=$(pnpm exec vitest run packages/coding-agent/src 2>&1); code=$?
          printf '%s\n' "$out"
          if [ $code -ne 0 ]; then while IFS= read -r line; do echo "::error::$line"; done <<< "$out"; fi
          exit $code
      - name: Diagnose Phase 0.1A gate
        continue-on-error: true
        shell: bash
        run: |
          set +e
          out=$(pnpm gate:0.1A 2>&1); code=$?
          printf '%s\n' "$out"
          if [ $code -ne 0 ]; then while IFS= read -r line; do echo "::error::$line"; done <<< "$out"; fi
          exit $code
      - name: Run Phase 0.8 focused tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          out=$(pnpm exec vitest run packages/application-protocol/src packages/host-runtime/src/application-service.integration.test.ts packages/web/src 2>&1); code=$?
          printf '%s\n' "$out"
          if [ $code -ne 0 ]; then while IFS= read -r line; do echo "::error::$line"; done <<< "$out"; fi
          exit $code
