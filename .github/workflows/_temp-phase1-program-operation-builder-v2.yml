name: Temporary Phase 1 Program operation builder v2

on:
  push:
    branches:
      - automation/phase-1.0-program-operation-bootstrap-v2

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/phase-1.0-program-operation-bootstrap-v2
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: pnpm
      - name: Create implementation branch
        run: git switch -c feat/phase-1.0-program-operation-correlation-final
      - name: Normalize writer helper for bounded patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('packages/host-runtime/src/program-dispatch.ts')
          text = path.read_text()
          start = text.index('function outstandingWriterOperations(')
          end = text.index('\n\nfunction activeWorkspaceAttempt', start)
          normalized = '''function outstandingWriterOperations(events: readonly PersistedDomainEvent<string, unknown>[]): string[] {
            const writers = new Set<string>();
            for (const event of events) {
              if (event.type === "operation.requested") {
                const payload = record(event.payload);
                const operationId = String(payload.operationId ?? event.operationId ?? "");
                const workspaceAccessClass = payload.workspaceAccessClass;
                const legacyMayWrite = workspaceAccessClass === undefined && payload.isReadOnly === false;
                if (operationId && (workspaceAccessClass === "may_write" || legacyMayWrite)) writers.add(operationId);
              } else if (event.type === "operation.mutation_quiesced") {
                const payload = record(event.payload);
                const operationId = String(payload.operationId ?? event.operationId ?? "");
                if (operationId) writers.delete(operationId);
              }
            }
            return [...writers].sort((a, b) => a.localeCompare(b, "en"));
          }'''
          # Remove Python indentation introduced by the workflow literal.
          normalized = '\n'.join(line[10:] if line.startswith('          ') else line for line in normalized.splitlines())
          path.write_text(text[:start] + normalized + text[end:])
          PY
      - name: Apply bounded Phase 1 implementation
        run: python3 .github/scripts/_temp_phase1_program_operation.py
      - name: Remove bootstrap-only files
        run: |
          rm .github/scripts/_temp_phase1_program_operation.py
          rm .github/workflows/_temp-phase1-program-operation-builder-v2.yml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck Host runtime
        run: pnpm --filter @alcode/host-runtime typecheck
      - name: Run targeted Program operation tests
        run: pnpm exec vitest run packages/host-runtime/src/program-operation-correlation.test.ts packages/host-runtime/src/program-dispatch.test.ts
      - name: Commit and publish implementation branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(1.0): correlate Program root operations"
          git push origin HEAD:refs/heads/feat/phase-1.0-program-operation-correlation-final
