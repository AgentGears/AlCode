name: Phase 0.8 closure docs

on:
  push:
    branches: [phase-0.8-closure-docs]
    paths:
      - .github/workflows/phase-0.8-close-docs.yml

permissions:
  contents: write

jobs:
  close-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-0.8-closure-docs
      - name: Record Phase 0.8 closure
        run: python scripts/close-phase-0.8-docs.py
      - name: Commit closure docs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/phase-0.8-plan.md docs/roadmap.md docs/phase-0-spec.md
          git commit -m "docs: close Phase 0.8"
          git push origin HEAD:phase-0.8-closure-docs
