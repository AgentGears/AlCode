name: S-01A Agent Runtime Kernel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle-kernel:
    name: Scoped lifecycle kernel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck agent-core
        run: pnpm --filter @alcode/agent-core typecheck
      - name: Verify lifecycle kernel and compatibility surface
        run: pnpm exec vitest run packages/agent-core/src/runtime-scope.test.ts packages/agent-core/src/agent-core.test.ts
