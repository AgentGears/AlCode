name: P-02 Verifier Patch Transport

"on":
  push:
    branches:
      - feat/p02-semantic-planning-v1

permissions:
  contents: write

jobs:
  patch-verifier-semantics:
    if: github.event.head_commit.message != 'fix(p02): preserve negative verifier measurement completion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p02-semantic-planning-v1
          fetch-depth: 0
      - name: Apply verifier completion semantics patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              source = target.read_text()
              if old not in source:
                  raise SystemExit(f"patch anchor not found in {path}: {old[:100]!r}")
              target.write_text(source.replace(old, new, 1))

          broker = "packages/host-runtime/src/capability-broker.ts"
          replace_once(
              broker,
              "  /** Host-only stable Program verification provenance; never Agent-authored. */\n  programVerificationInvocation?: HostProgramVerificationInvocationV1;\n  signal?: AbortSignal;",
              "  /** Host-only stable Program verification provenance; never Agent-authored. */\n  programVerificationInvocation?: HostProgramVerificationInvocationV1;\n  /** Host-only execution-completion policy selected by the admitted verifier spec. */\n  programVerificationOperationCompletionSemantics?: \"numeric_exit_is_completed\";\n  signal?: AbortSignal;",
          )
          replace_once(
              broker,
              "    is_failure: outcome !== \"succeeded\",",
              "    is_failure: typeof execution.exitCode === \"number\"\n      ? execution.exitCode !== 0\n      : outcome !== \"succeeded\",",
          )
          replace_once(
              broker,
              "function workspaceAccessClassOf(capability: HostCapability): WorkspaceAccessClassV1 {",
              "function programVerificationOperationOutcome(\n  request: CapabilityBrokerRequest,\n  execution: HostCapabilityResult,\n  rawOutcome: ExecutionOutcome,\n): ExecutionOutcome {\n  if (\n    request.programVerificationInvocation?.kind === \"operation_result\"\n    && request.programVerificationOperationCompletionSemantics === \"numeric_exit_is_completed\"\n    && rawOutcome === \"failed\"\n    && typeof execution.exitCode === \"number\"\n  ) {\n    return \"succeeded\";\n  }\n  return rawOutcome;\n}\n\nfunction workspaceAccessClassOf(capability: HostCapability): WorkspaceAccessClassV1 {",
          )
          replace_once(
              broker,
              "          ...(request.programVerificationInvocation !== undefined\n            ? { programVerificationInvocation: freezeCanonical(request.programVerificationInvocation) }\n            : {}),",
              "          ...(request.programVerificationInvocation !== undefined\n            ? { programVerificationInvocation: freezeCanonical(request.programVerificationInvocation) }\n            : {}),\n          ...(request.programVerificationOperationCompletionSemantics !== undefined\n            ? { programVerificationOperationCompletionSemantics: request.programVerificationOperationCompletionSemantics }\n            : {}),",
          )
          replace_once(
              broker,
              "      execution = await capability.execute(frozenArgs, context);\n      outcome = execution.outcome ?? \"succeeded\";",
              "      execution = await capability.execute(frozenArgs, context);\n      const rawOutcome = execution.outcome ?? \"succeeded\";\n      outcome = programVerificationOperationOutcome(request, execution, rawOutcome);",
          )

          verification = "packages/host-runtime/src/program-verification.ts"
          replace_once(
              verification,
              "  workspaceAccessClass: WorkspaceAccessClassV1;\n  isSuccessful(result: CapabilityBrokerResult): boolean;",
              "  workspaceAccessClass: WorkspaceAccessClassV1;\n  /** A numeric process exit completed the measurement; the Host predicate still decides satisfaction. */\n  operationCompletionSemantics?: \"numeric_exit_is_completed\";\n  isSuccessful(result: CapabilityBrokerResult): boolean;",
          )
          replace_once(
              verification,
              "      program: prepared.attempt,\n      programVerificationInvocation: invocation,\n    });",
              "      program: prepared.attempt,\n      programVerificationInvocation: invocation,\n      ...(prepared.spec.operationCompletionSemantics !== undefined\n        ? { programVerificationOperationCompletionSemantics: prepared.spec.operationCompletionSemantics }\n        : {}),\n    });",
          )

          profile = "packages/coding-agent/src/verification-profile.ts"
          replace_once(
              profile,
              "  const operationSpecs = new HostVerificationOperationRegistryV1([\n    { specId: COMMAND_EXIT_ZERO_SPEC_ID, specVersion: COMMAND_EXIT_ZERO_SPEC_VERSION, ...exitZero },\n    { specId: PACKAGE_TYPECHECK_SPEC_ID, specVersion: PACKAGE_TYPECHECK_SPEC_VERSION, ...exitZero },\n    { specId: PACKAGE_LINT_SPEC_ID, specVersion: PACKAGE_LINT_SPEC_VERSION, ...exitZero },\n    { specId: TARGETED_PACKAGE_TEST_SPEC_ID, specVersion: TARGETED_PACKAGE_TEST_SPEC_VERSION, ...exitZero },\n  ]);",
              "  const numericExitVerifier = {\n    ...exitZero,\n    operationCompletionSemantics: \"numeric_exit_is_completed\" as const,\n  };\n  const operationSpecs = new HostVerificationOperationRegistryV1([\n    { specId: COMMAND_EXIT_ZERO_SPEC_ID, specVersion: COMMAND_EXIT_ZERO_SPEC_VERSION, ...exitZero },\n    { specId: PACKAGE_TYPECHECK_SPEC_ID, specVersion: PACKAGE_TYPECHECK_SPEC_VERSION, ...numericExitVerifier },\n    { specId: PACKAGE_LINT_SPEC_ID, specVersion: PACKAGE_LINT_SPEC_VERSION, ...numericExitVerifier },\n    { specId: TARGETED_PACKAGE_TEST_SPEC_ID, specVersion: TARGETED_PACKAGE_TEST_SPEC_VERSION, ...numericExitVerifier },\n  ]);",
          )

          test = "packages/coding-agent/src/verification-profile.test.ts"
          replace_once(
              test,
              "    expect(spec.workspaceAccessClass).toBe(\"may_write\");\n    expect(spec.isSuccessful({ outcome: \"succeeded\", result: { details: { exitCode: 0 } } })).toBe(true);",
              "    expect(spec.workspaceAccessClass).toBe(\"may_write\");\n    expect(spec.operationCompletionSemantics).toBeUndefined();\n    for (const typedSpecId of [PACKAGE_TYPECHECK_SPEC_ID, PACKAGE_LINT_SPEC_ID, TARGETED_PACKAGE_TEST_SPEC_ID]) {\n      expect(profile.operationSpecs.resolve(typedSpecId, 1).operationCompletionSemantics)\n        .toBe(\"numeric_exit_is_completed\");\n    }\n    expect(spec.isSuccessful({ outcome: \"succeeded\", result: { details: { exitCode: 0 } } })).toBe(true);",
          )
          PY
          git diff --check
      - name: Commit verifier semantics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/host-runtime/src/capability-broker.ts \
                  packages/host-runtime/src/program-verification.ts \
                  packages/coding-agent/src/verification-profile.ts \
                  packages/coding-agent/src/verification-profile.test.ts
          git commit -m "fix(p02): preserve negative verifier measurement completion"
          git push origin HEAD:feat/p02-semantic-planning-v1
