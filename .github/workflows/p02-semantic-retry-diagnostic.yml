name: P-02 Semantic Retry Diagnostic

"on":
  push:
    branches:
      - feat/p02-semantic-planning-v1
  pull_request:
    paths:
      - "packages/coding-agent/src/cli-p02-semantic-retry.integration.test.ts"
      - ".github/workflows/p02-semantic-retry-diagnostic.yml"

permissions:
  contents: read

jobs:
  p02-semantic-retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Shorten focused timeout and expose durable trace
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/coding-agent/src/cli-p02-semantic-retry.integration.test.ts")
          source = path.read_text()
          source = source.replace("      timeout: 120_000,", "      timeout: 20_000,", 1)
          old = "    expect(result.error).toBeUndefined();"
          new = "\n".join([
              "    expect(",
              "      result.error,",
              "      `Subprocess error: ${String(result.error)}\\nSTDERR:\\n${result.stderr}\\nSTDOUT:\\n${result.stdout}\\nDurable trace:\\n${diagnosticTrace(events).map((entry) => JSON.stringify(entry)).join(\"\\n\")}` ,",
              "    ).toBeUndefined();",
          ])
          if old not in source:
              raise SystemExit("diagnostic assertion insertion point not found")
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Run focused P-02 semantic retry vertical
        run: npx vitest run packages/coding-agent/src/cli-p02-semantic-retry.integration.test.ts --reporter=verbose
