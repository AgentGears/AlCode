name: Phase 0.8 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate-0-8:
    name: Phase 0.8 gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Run Phase 0.8 gate
        env:
          ALCODE_HOME: ${{ runner.temp }}/alcode-home
        run: pnpm gate:0.8
