name: Temporary Phase 1 lockfile update

on:
  push:
    branches:
      - feat/phase-1.0-program-creation

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-1.0-program-creation
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: pnpm
      - name: Regenerate lockfile only
        run: pnpm install --lockfile-only
      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: sync pnpm lockfile for ProgramState dependency"
          git push origin HEAD:feat/phase-1.0-program-creation
