name: Phase 0.8 source fix

on:
  push:
    branches: [phase-0.8-implementation]
    paths:
      - .github/workflows/phase-0.8-source-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-0.8-implementation
      - name: Narrow exact optional public fields
        shell: python
        run: |
          from pathlib import Path
          path = Path("packages/host-runtime/src/application-service.ts")
          text = path.read_text()
          old1 = '''        push({
                    type: "input.admitted",
                    commandId: stringValue(payload.commandId),
                    text: stringValue(payload.text),
                    requestedDisposition,
                    admittedDisposition,
                    ...(optionalString(payload.fallbackReasonCode) ? { fallbackReasonCode: optionalString(payload.fallbackReasonCode) } : {}),
                    ...(optionalString(payload.targetExecutionId) ? { targetExecutionId: optionalString(payload.targetExecutionId) } : {}),
                    ...(optionalString(payload.queueItemId) ? { queueItemId: optionalString(payload.queueItemId) } : {}),
                  }, event);
          '''
          new1 = '''        const fallbackReasonCode = optionalString(payload.fallbackReasonCode);
                  const targetExecutionId = optionalString(payload.targetExecutionId);
                  const queueItemId = optionalString(payload.queueItemId);
                  push({
                    type: "input.admitted",
                    commandId: stringValue(payload.commandId),
                    text: stringValue(payload.text),
                    requestedDisposition,
                    admittedDisposition,
                    ...(fallbackReasonCode !== undefined ? { fallbackReasonCode } : {}),
                    ...(targetExecutionId !== undefined ? { targetExecutionId } : {}),
                    ...(queueItemId !== undefined ? { queueItemId } : {}),
                  }, event);
          '''
          if old1 not in text:
              raise SystemExit("input admitted anchor not found")
          text = text.replace(old1, new1, 1)
          old2 = '''        const interaction: PublicPermissionInteraction = {
                    interactionId: stringValue(payload.interactionId),
                    kind: "permission",
                    status: "pending",
                    toolName: stringValue(payload.toolName),
                    description: stringValue(payload.description),
                    ...(optionalString(payload.operationId) ? { operationId: optionalString(payload.operationId) } : {}),
                  };
          '''
          new2 = '''        const operationId = optionalString(payload.operationId);
                  const interaction: PublicPermissionInteraction = {
                    interactionId: stringValue(payload.interactionId),
                    kind: "permission",
                    status: "pending",
                    toolName: stringValue(payload.toolName),
                    description: stringValue(payload.description),
                    ...(operationId !== undefined ? { operationId } : {}),
                  };
          '''
          if old2 not in text:
              raise SystemExit("permission interaction anchor not found")
          text = text.replace(old2, new2, 1)
          path.write_text(text)
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/host-runtime/src/application-service.ts
          git commit -m "fix(0.8): narrow optional public event fields"
          git push origin HEAD:phase-0.8-implementation
