name: Phase 0.8 source fix

on:
  push:
    branches: [phase-0.8-implementation]
    paths:
      - .github/workflows/phase-0.8-source-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-0.8-implementation
      - name: Apply bounded TypeScript union fix
        shell: python
        run: |
          from pathlib import Path
          path = Path("packages/host-runtime/src/application-service.ts")
          text = path.read_text()
          anchor = '''interface PermissionResolver {
            resolve(decision: PermissionDecision): void;
          }
          '''
          addition = anchor + '''
          type PublicEventBody<T extends ApplicationEvent = ApplicationEvent> =
            T extends ApplicationEvent
              ? Omit<T, "protocolVersion" | "fromCursor" | "sequence" | "sessionId" | "occurredAt" | "cause">
              : never;
          '''
          if "type PublicEventBody<" not in text:
              if anchor not in text:
                  raise SystemExit("permission resolver anchor not found")
              text = text.replace(anchor, addition, 1)
          old = 'const push = (event: Omit<ApplicationEvent, "protocolVersion" | "fromCursor" | "sequence" | "sessionId" | "occurredAt" | "cause">, source: PersistedDomainEvent<string, unknown>): void => {'
          new = 'const push = (event: PublicEventBody, source: PersistedDomainEvent<string, unknown>): void => {'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("push signature anchor not found")
          path.write_text(text)
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/host-runtime/src/application-service.ts
          git commit -m "fix(0.8): preserve discriminated public event bodies"
          git push origin HEAD:phase-0.8-implementation
