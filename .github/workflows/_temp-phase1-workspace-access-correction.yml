name: Temporary Phase 1 Workspace access correction

on:
  push:
    branches:
      - automation/phase-1.0-workspace-access-correction

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/phase-1.0-workspace-access-correction
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: pnpm
      - name: Create correction branch
        run: git switch -c fix/phase-1.0-workspace-access-invalid
      - name: Apply bounded correction
        run: python3 .github/scripts/_temp_phase1_workspace_access_correction.py
      - name: Remove bootstrap-only files
        run: |
          rm .github/scripts/_temp_phase1_workspace_access_correction.py
          rm .github/workflows/_temp-phase1-workspace-access-correction.yml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck Host runtime
        run: pnpm --filter @alcode/host-runtime typecheck
      - name: Run targeted Program operation tests
        run: pnpm exec vitest run packages/host-runtime/src/program-operation-correlation.test.ts packages/host-runtime/src/program-dispatch.test.ts
      - name: Commit and publish correction branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(1.0): fail invalid Workspace access closed"
          git push origin HEAD:refs/heads/fix/phase-1.0-workspace-access-invalid
