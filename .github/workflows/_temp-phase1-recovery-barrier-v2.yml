name: Temporary Phase 1 recovery barrier v2

on:
  push:
    branches:
      - automation/phase-1.0-recovery-barrier-build-v2

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Preserve builder and create clean feature branch
        run: |
          cp .github/scripts/_temp-phase1-recovery.py /tmp/phase1-recovery.py
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/phase1-recovery.py')
          s = p.read_text()
          old = "    'import { DefaultHostPolicy, type HostPolicy } from \"./policy.ts\";\\n',\n    'import { DefaultHostPolicy, type HostPolicy } from \"./policy.ts\";\\nimport type { WorkspaceMutationAdmissionAuthorityV1 } from \"./program-recovery.ts\";\\n',"
          new = "    'import type { HostPolicy } from \"./policy.ts\";\\n',\n    'import type { HostPolicy } from \"./policy.ts\";\\nimport type { WorkspaceMutationAdmissionAuthorityV1 } from \"./program-recovery.ts\";\\n',"
          if old not in s:
              raise SystemExit('builder import correction target missing')
          p.write_text(s.replace(old, new, 1))
          PY
          git fetch origin main
          git checkout -b feat/phase-1.0-recovery-barrier origin/main
      - name: Apply bounded recovery slice
        run: python /tmp/phase1-recovery.py
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: |
          pnpm --filter @alcode/storage typecheck
          pnpm --filter @alcode/host-runtime typecheck
      - name: Focused tests
        run: |
          pnpm --filter @alcode/storage exec vitest run src/operations.test.ts src/recovery.test.ts
          pnpm --filter @alcode/host-runtime exec vitest run src/program-recovery.test.ts src/program-dispatch.test.ts src/program-operation-correlation.test.ts src/recovery.integration.test.ts src/host-runtime.integration.test.ts
      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/host-runtime/src/capability-broker.ts packages/host-runtime/src/host.ts packages/host-runtime/src/index.ts packages/host-runtime/src/program-recovery.ts packages/host-runtime/src/program-recovery.test.ts
          git commit -m "feat(1.0): recover workspace execution authority"
          git push origin feat/phase-1.0-recovery-barrier
