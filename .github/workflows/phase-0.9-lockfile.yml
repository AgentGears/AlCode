name: Phase 0.9 lockfile refresh
on:
  push:
    branches: [phase-0.9]
permissions:
  contents: write
jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: phase-0.9, fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.13.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.17.0, cache: pnpm }
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase-0.9-lockfile.yml
          git add pnpm-lock.yaml
          git commit -m "chore: refresh Phase 0.9 workspace lockfile [lockfile-refresh]"
          git push origin HEAD:phase-0.9
