name: P-02 Verifier Effect-Absence Patch

"on":
  push:
    branches:
      - feat/p02-semantic-planning-v1

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p02-semantic-planning-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Host verifier effect-absence semantics and regressions
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then
            echo "bot follow-up push; nothing to patch"
            exit 0
          fi
          python scripts/p02-effect-absence-patch.py
      - name: Run focused Host verifier regressions
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then exit 0; fi
          pnpm exec vitest run packages/host-runtime/src/program-verification.test.ts packages/coding-agent/src/verification-profile.test.ts --reporter=verbose
      - name: Run P-02 vertical and expose masked driver root on failure
        shell: bash
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then exit 0; fi
          if pnpm exec vitest run packages/coding-agent/src/cli-p02-semantic-retry.integration.test.ts --reporter=verbose; then
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          path = Path("packages/coding-agent/src/cli.ts")
          source = path.read_text()
          old = '''    } catch (error) {
      await cancelActiveProgram("program_driver_failure").catch(() => undefined);'''
          new = '''    } catch (error) {
      console.error("[p02-driver-root]", error instanceof Error ? `${error.name}: ${error.message}` : String(error));
      await cancelActiveProgram("program_driver_failure").catch(() => undefined);'''
          if old not in source:
              raise SystemExit("driver diagnostic insertion point not found")
          path.write_text(source.replace(old, new, 1))
          PY
          pnpm exec vitest run packages/coding-agent/src/cli-p02-semantic-retry.integration.test.ts --reporter=verbose || true
          exit 1
      - name: Commit verified effect-absence semantics
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/host-runtime/src/program-dispatch.ts packages/host-runtime/src/program-verification.ts packages/host-runtime/src/program-verification.test.ts
          git commit -m "fix(p02): certify unchanged verifier measurement effects"
          git push origin HEAD:feat/p02-semantic-planning-v1
