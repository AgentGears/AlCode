name: P-02 Verifier Effect-Absence Patch

"on":
  push:
    branches:
      - feat/p02-semantic-planning-v1

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p02-semantic-planning-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply P-02 verifier, recovery, and replay corrections
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then exit 0; fi
          python scripts/p02-effect-absence-patch.py
          python scripts/p02-replay-cursor-fix.py
      - name: Run replay liveness regression
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then exit 0; fi
          pnpm exec vitest run packages/storage/src/sqlite-event-store.test.ts -t "replay releases SQLite query ownership before each async yield" --reporter=verbose
      - name: Run focused verifier and recovery regressions
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then exit 0; fi
          pnpm exec vitest run packages/host-runtime/src/program-verification.test.ts packages/coding-agent/src/verification-profile.test.ts packages/program-state/src/program-state.test.ts --reporter=verbose
      - name: Run P-02 product vertical
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then exit 0; fi
          pnpm exec vitest run packages/coding-agent/src/cli-p02-semantic-retry.integration.test.ts --reporter=verbose
      - name: Commit verified P-02 verifier, recovery, and replay corrections
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/host-runtime/src/program-dispatch.ts packages/host-runtime/src/program-verification.ts packages/host-runtime/src/program-verification.test.ts packages/program-state/src/reducer-core.ts packages/program-state/src/program-state.test.ts packages/storage/src/sqlite-event-store.ts packages/storage/src/sqlite-event-store.test.ts
          git commit -m "fix(p02): preserve verifier and replay authority"
          git push origin HEAD:feat/p02-semantic-planning-v1
