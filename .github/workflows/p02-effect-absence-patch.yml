name: P-02 Verifier Effect-Absence Patch

"on":
  push:
    branches:
      - feat/p02-semantic-planning-v1

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p02-semantic-planning-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply P-02 verifier and recovery corrections
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then exit 0; fi
          python scripts/p02-effect-absence-patch.py
      - name: Run focused verifier and recovery regressions
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then exit 0; fi
          pnpm exec vitest run packages/host-runtime/src/program-verification.test.ts packages/coding-agent/src/verification-profile.test.ts packages/program-state/src/program-state.test.ts --reporter=verbose
      - name: Pinpoint operations projection stall
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then exit 0; fi
          python - <<'PY'
          from pathlib import Path

          test = Path("packages/coding-agent/src/cli-p02-semantic-retry.integration.test.ts")
          source = test.read_text().replace("      timeout: 20_000,", "      timeout: 10_000,", 1)
          anchor = "    const events = await replay(home, root);"
          replacement = "    process.stderr.write(result.stderr ?? \"\");\n    process.stdout.write(result.stdout ?? \"\");\n" + anchor
          if anchor not in source:
              raise SystemExit("P-02 product diagnostic anchor not found")
          test.write_text(source.replace(anchor, replacement, 1))

          broker = Path("packages/host-runtime/src/capability-broker.ts")
          source = broker.read_text()
          old = """    this.catchUpBarriers();\n\n    let execution: HostCapabilityResult;"""
          new = """    console.error(`[p02-broker] before-catchup operation=${String(operationId)} tool=${request.toolName}`);\n    this.catchUpBarriers();\n    console.error(`[p02-broker] after-catchup operation=${String(operationId)} tool=${request.toolName}`);\n\n    let execution: HostCapabilityResult;"""
          if old not in source:
              raise SystemExit("capability broker catch-up diagnostic anchor not found")
          broker.write_text(source.replace(old, new, 1))

          projection = Path("packages/storage/src/projection.ts")
          source = projection.read_text()
          old = """    let cursor = this.getCursor(projection.name);"""
          new = """    if (projection.name === \"operations\") console.error(`[p02-proj] before-get-cursor`);\n    let cursor = this.getCursor(projection.name);\n    if (projection.name === \"operations\") console.error(`[p02-proj] after-get-cursor seq=${cursor.lastAppliedEventSequence}`);"""
          if old not in source: raise SystemExit("cursor anchor not found")
          source = source.replace(old, new, 1)
          old = """    const headRow = this.db.prepare(\"SELECT MAX(sequence) as max_seq FROM events\").get() as { max_seq: number | null } | undefined;"""
          new = """    if (projection.name === \"operations\") console.error(`[p02-proj] before-head`);\n    const headRow = this.db.prepare(\"SELECT MAX(sequence) as max_seq FROM events\").get() as { max_seq: number | null } | undefined;\n    if (projection.name === \"operations\") console.error(`[p02-proj] after-head max=${String(headRow?.max_seq ?? 0)}`);"""
          if old not in source: raise SystemExit("head anchor not found")
          source = source.replace(old, new, 1)
          old = """    const events = this.verifiedReads(cursor.lastAppliedEventSequence, limit);"""
          new = """    if (projection.name === \"operations\") console.error(`[p02-proj] before-verified-reads from=${cursor.lastAppliedEventSequence}`);\n    const events = this.verifiedReads(cursor.lastAppliedEventSequence, limit);\n    if (projection.name === \"operations\") console.error(`[p02-proj] after-verified-reads count=${events.length}`);"""
          if old not in source: raise SystemExit("reads anchor not found")
          source = source.replace(old, new, 1)
          old = """    const statements = compileStatements(this.db, projection.statements);"""
          new = """    if (projection.name === \"operations\") console.error(`[p02-proj] before-compile`);\n    const statements = compileStatements(this.db, projection.statements);\n    if (projection.name === \"operations\") console.error(`[p02-proj] after-compile`);"""
          if old not in source: raise SystemExit("compile anchor not found")
          source = source.replace(old, new, 1)
          old = """      this.db.transaction(() => {\n        const { tx, invalidate } = createTransaction(this.db, statements);\n        try { projection.apply(event, tx); } finally { invalidate(); }\n        this.db.prepare(\n          `INSERT INTO projection_cursors (projection_name, last_applied_event_sequence, projection_schema_version, classification)\n           VALUES (?, ?, ?, ?)\n           ON CONFLICT(projection_name) DO UPDATE SET\n             last_applied_event_sequence = excluded.last_applied_event_sequence,\n             projection_schema_version = excluded.projection_schema_version,\n             classification = excluded.classification`,\n        ).run(projection.name, seq, projection.schemaVersion, projection.classification);\n      })();"""
          new = """      if (projection.name === \"operations\") console.error(`[p02-proj] event seq=${seq} type=${event.type} before-transaction`);\n      this.db.transaction(() => {\n        if (projection.name === \"operations\") console.error(`[p02-proj] event seq=${seq} entered-transaction`);\n        const { tx, invalidate } = createTransaction(this.db, statements);\n        if (projection.name === \"operations\") console.error(`[p02-proj] event seq=${seq} before-apply`);\n        try { projection.apply(event, tx); } finally { invalidate(); }\n        if (projection.name === \"operations\") console.error(`[p02-proj] event seq=${seq} after-apply before-cursor`);\n        this.db.prepare(\n          `INSERT INTO projection_cursors (projection_name, last_applied_event_sequence, projection_schema_version, classification)\n           VALUES (?, ?, ?, ?)\n           ON CONFLICT(projection_name) DO UPDATE SET\n             last_applied_event_sequence = excluded.last_applied_event_sequence,\n             projection_schema_version = excluded.projection_schema_version,\n             classification = excluded.classification`,\n        ).run(projection.name, seq, projection.schemaVersion, projection.classification);\n        if (projection.name === \"operations\") console.error(`[p02-proj] event seq=${seq} after-cursor`);\n      })();\n      if (projection.name === \"operations\") console.error(`[p02-proj] event seq=${seq} after-transaction`);"""
          if old not in source: raise SystemExit("transaction anchor not found")
          projection.write_text(source.replace(old, new, 1))
          PY
      - name: Run P-02 product vertical
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then exit 0; fi
          pnpm exec vitest run packages/coding-agent/src/cli-p02-semantic-retry.integration.test.ts --reporter=verbose
      - name: Commit verified P-02 verifier and recovery corrections
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/host-runtime/src/program-dispatch.ts packages/host-runtime/src/program-verification.ts packages/host-runtime/src/program-verification.test.ts packages/program-state/src/reducer-core.ts packages/program-state/src/program-state.test.ts
          git commit -m "fix(p02): preserve verifier and replacement authority"
          git push origin HEAD:feat/p02-semantic-planning-v1
