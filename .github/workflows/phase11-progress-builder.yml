name: Phase 1.1 progress builder

on:
  push:
    branches:
      - automation/phase11-progress-builder-run

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare clean feature branch
        run: |
          cp .automation/phase11-progress-builder.py /tmp/phase11-progress-builder.py
          git fetch origin main
          git switch -C feat/phase-1.1-program-progress origin/main
          git rm -f .github/workflows/phase11-progress-builder.yml .automation/phase11-progress-builder.py || true
      - name: Apply bounded Phase 1.1 progress slice
        run: python /tmp/phase11-progress-builder.py
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify Agent protocol
        run: |
          pnpm --filter @alcode/agent-protocol typecheck
          pnpm --filter @alcode/agent-protocol test
      - name: Verify Host progress bridge
        run: |
          pnpm --filter @alcode/host-runtime typecheck
          pnpm --filter @alcode/host-runtime test
      - name: Commit and publish clean feature branch
        run: |
          git status --short
          git add -A
          git config user.name "ALCODE Automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat(1.1): add Program progress proposal bridge"
          git push --force origin HEAD:feat/phase-1.1-program-progress
