name: Phase 1.1 planning builder

on:
  push:
    branches:
      - automation/phase11-planning-builder

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare clean feature branch
        run: |
          cp .automation/phase11-planning-builder.py /tmp/phase11-planning-builder.py
          git fetch origin main
          git switch -C feat/phase-1.1-program-planning origin/main
      - name: Apply bounded Phase 1.1 planning slice
        run: python /tmp/phase11-planning-builder.py
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify agent protocol
        run: |
          pnpm --filter @alcode/agent-protocol typecheck
          pnpm --filter @alcode/agent-protocol test
      - name: Verify Host planning bridge
        run: |
          pnpm --filter @alcode/host-runtime typecheck
          pnpm --filter @alcode/host-runtime test
      - name: Commit and publish clean feature branch
        run: |
          git status --short
          git add packages/agent-protocol/src/messages.ts \
                  packages/agent-protocol/src/validation.ts \
                  packages/agent-protocol/src/index.ts \
                  packages/agent-protocol/src/program-execution-protocol.test.ts \
                  packages/host-runtime/src/host.ts \
                  packages/host-runtime/src/program-agent.ts \
                  packages/host-runtime/src/program-planning.ts \
                  packages/host-runtime/src/program-planning.test.ts \
                  packages/host-runtime/src/program-execution-runtime.ts \
                  packages/host-runtime/src/index.ts
          git config user.name "ALCODE Automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat(1.1): add Program planning proposal bridge"
          git push --force-with-lease origin HEAD:feat/phase-1.1-program-planning
