name: P-02 macOS termination closure

"on":
  push:
    branches:
      - feat/p02-semantic-planning-v1

permissions:
  contents: write

jobs:
  close-macos-termination:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p02-semantic-planning-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply bounded adaptive termination correction
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path("packages/host-runtime/src/program-execution-runtime-v2.ts")
          source = runtime.read_text()
          if source.count("connection.terminate();") != 3:
              raise SystemExit("unexpected adaptive terminate call count")
          source = source.replace("connection.terminate();", "terminateAgentBestEffort(connection);")
          anchor = '''function progressFailure(
            message: { requestId: string; sessionId: string },
          ): ProgramProgressResultV2 {
            return {
              type: "program.progress.result",
              version: PROGRAM_EXECUTION_V2_MESSAGE_VERSION,
              requestId: message.requestId,
              sessionId: message.sessionId,
              outcome: "failed",
              errorCode: "adaptive_runtime_failure",
              error: "Adaptive Program progress routing failed",
            };
          }
          '''
          helper = anchor + '''
          function terminateAgentBestEffort(connection: AgentConnection): void {
            try {
              connection.terminate();
            } catch {
              // Adaptive protocol callbacks are fire-and-forget. Process-signalling
              // failures must not escape the Host callback after canonical truth is durable.
            }
          }
          '''
          if anchor not in source:
              raise SystemExit("progressFailure anchor not found")
          runtime.write_text(source.replace(anchor, helper, 1))

          test = Path("packages/host-runtime/src/program-execution-runtime-v2.test.ts")
          text = test.read_text()
          text = text.replace(
              'expect(source).toContain("connection.terminate();");',
              'expect(source).toContain("terminateAgentBestEffort(connection);");',
              1,
          )
          old = '''    const finalizer = source.indexOf("finally {\\n      connection.terminate();\\n    }", helper);
          '''
          new = '''    const finalizer = source.indexOf("finally {\\n      terminateAgentBestEffort(connection);\\n    }", helper);
          '''
          if old not in text:
              raise SystemExit("terminal finalizer test anchor not found")
          text = text.replace(old, new, 1)
          insertion = '''
            it("contains OS process-signalling failures inside adaptive fire-and-forget callbacks", () => {
              const helper = source.indexOf("function terminateAgentBestEffort(connection: AgentConnection): void");
              const signal = source.indexOf("connection.terminate();", helper);
              const catcher = source.indexOf("} catch {", signal);
              expect(helper).toBeGreaterThan(-1);
              expect(signal).toBeGreaterThan(helper);
              expect(catcher).toBeGreaterThan(signal);
              expect(source.match(/terminateAgentBestEffort\\(connection\\);/g)?.length).toBeGreaterThanOrEqual(3);
              expect(source).toContain("failures must not escape the Host callback");
            });
          '''
          marker = '''  it("cleans adaptive generation state on displacement, explicit detach, and process exit", () => {
          '''
          if marker not in text:
              raise SystemExit("adaptive cleanup test marker not found")
          test.write_text(text.replace(marker, insertion + "\n" + marker, 1))
          PY
      - name: Typecheck Host runtime
        run: pnpm --filter @alcode/host-runtime typecheck
      - name: Run focused adaptive runtime regression
        run: pnpm exec vitest run packages/host-runtime/src/program-execution-runtime-v2.test.ts --reporter=verbose
      - name: Re-run failing macOS Phase 0.1B gate
        run: pnpm gate:0.1B
      - name: Commit verified macOS termination correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/host-runtime/src/program-execution-runtime-v2.ts \
            packages/host-runtime/src/program-execution-runtime-v2.test.ts
          git rm .github/workflows/p02-macos-termination-closure.yml
          git diff --cached --check
          git commit -m "fix(p02): contain adaptive Agent termination races"
          git push origin HEAD:feat/p02-semantic-planning-v1
