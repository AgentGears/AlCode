name: P-02 macOS termination closure

"on":
  push:
    branches:
      - feat/p02-semantic-planning-v1

permissions:
  contents: read

jobs:
  diagnose-macos-retry:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p02-semantic-planning-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply bounded adaptive termination correction
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path("packages/host-runtime/src/program-execution-runtime-v2.ts")
          source = runtime.read_text()
          if source.count("connection.terminate();") != 3:
              raise SystemExit("unexpected adaptive terminate call count")
          source = source.replace("connection.terminate();", "terminateAgentBestEffort(connection);")
          anchor = '''function progressFailure(
            message: { requestId: string; sessionId: string },
          ): ProgramProgressResultV2 {
            return {
              type: "program.progress.result",
              version: PROGRAM_EXECUTION_V2_MESSAGE_VERSION,
              requestId: message.requestId,
              sessionId: message.sessionId,
              outcome: "failed",
              errorCode: "adaptive_runtime_failure",
              error: "Adaptive Program progress routing failed",
            };
          }
          '''
          helper = anchor + '''
          function terminateAgentBestEffort(connection: AgentConnection): void {
            try {
              connection.terminate();
            } catch {
              // Adaptive protocol callbacks are fire-and-forget. Process-signalling
              // failures must not escape the Host callback after canonical truth is durable.
            }
          }
          '''
          if anchor not in source:
              raise SystemExit("progressFailure anchor not found")
          runtime.write_text(source.replace(anchor, helper, 1))
          PY
      - name: Add bounded product diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          test = Path("packages/coding-agent/src/cli-p02-semantic-retry.integration.test.ts")
          source = test.read_text()
          anchor = '    const trace = diagnosticTrace(events).map((entry) => JSON.stringify(entry)).join("\\n");\n'
          diagnostic = anchor + '''    process.stderr.write(`\\n[P02-MAC-STDERR]\\n${result.stderr ?? ""}`);
              process.stderr.write(`\\n[P02-MAC-STDOUT]\\n${result.stdout ?? ""}`);
              process.stderr.write(`\\n[P02-MAC-TRACE]\\n${trace}\\n`);
          '''
          if anchor not in source:
              raise SystemExit("trace anchor not found")
          source = source.replace(anchor, diagnostic, 1)
          source = source.replace(
              '    expect(sealed).toBeDefined();',
              '    expect(sealed, `sealed draft missing\\nDurable trace:\\n${trace}`).toBeDefined();',
              1,
          )
          source = source.replace(
              '    expect(failure).toBeDefined();',
              '    expect(failure, `verification failure fact missing\\nDurable trace:\\n${trace}`).toBeDefined();',
              1,
          )
          test.write_text(source)
          PY
      - name: Run macOS P-02 product diagnostic
        run: pnpm exec vitest run packages/coding-agent/src/cli-p02-semantic-retry.integration.test.ts --reporter=verbose
