name: Temporary Phase 1 dispatch check

on:
  push:
    branches:
      - feat/phase-1.0-program-dispatch

permissions:
  contents: write

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-1.0-program-dispatch
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: pnpm
      - name: Remove temporary test helper typo
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/host-runtime/src/program-dispatch.test.ts')
          s = p.read_text()
          bad = '''function serviceOptions(input: {
            store: Parameters<typeof CanonicalAdmissionQueue>[0] extends never ? never : any;
          }): never {
            throw new Error(String(input));
          }

          '''
          # Normalize indentation introduced by the here-doc source itself.
          bad = bad.replace('          ', '')
          if bad not in s:
            raise SystemExit('temporary helper block not found')
          p.write_text(s.replace(bad, '', 1))
          PY
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck Host runtime
        run: pnpm --filter @alcode/host-runtime typecheck
      - name: Test dispatch slice
        run: pnpm exec vitest run packages/host-runtime/src/program-dispatch.test.ts
      - name: Commit bounded correction
        shell: bash
        run: |
          if git diff --quiet -- packages/host-runtime/src/program-dispatch.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/host-runtime/src/program-dispatch.test.ts
          git commit -m "test(1.0): correct Program dispatch fixture"
          git push origin HEAD:feat/phase-1.0-program-dispatch
