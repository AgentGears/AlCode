name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# concurrency temporarily removed to work around stuck runner

jobs:
  gate-0-0:
    name: Phase 0.0 gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Native modules (esbuild, fs-ext, better-sqlite3) are built during
      # install via pnpm.onlyBuiltDependencies in the root package.json.

      - name: Run Phase 0.0 gate
        env:
          ALCODE_HOME: ${{ runner.temp }}/alcode-home
        run: pnpm gate:0.0

      - name: Run Phase 0.1A gate
        env:
          ALCODE_HOME: ${{ runner.temp }}/alcode-home
        run: pnpm gate:0.1A

      - name: Typecheck + test workspace, storage, and secrets packages
        run: |
          pnpm --filter @alcode/workspace exec tsc --noEmit -p tsconfig.json
          pnpm --filter @alcode/storage exec tsc --noEmit -p tsconfig.json
          pnpm --filter @alcode/secrets exec tsc --noEmit -p tsconfig.json
          pnpm --filter @alcode/workspace exec vitest run
          pnpm --filter @alcode/storage exec vitest run
          pnpm --filter @alcode/secrets exec vitest run

      - name: Run Phase 0.2 gate
        env:
          ALCODE_HOME: ${{ runner.temp }}/alcode-home
        run: pnpm gate:0.2
