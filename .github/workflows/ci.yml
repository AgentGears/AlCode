name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Phase 0.5 bootstrap note: installs temporarily allow lockfile refresh while
# new workspace importers are being established. The generated lockfile is
# uploaded by phase-0-5-dev and will be checked in before the final gate;
# frozen installs are restored before Phase 0.5 closure evidence is accepted.

jobs:
  gate-0-0:
    name: Phase 0.0 gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: pnpm
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Run Phase 0.0 gate
        env:
          ALCODE_HOME: ${{ runner.temp }}/alcode-home
        run: pnpm gate:0.0
      - name: Run Phase 0.1A gate
        env:
          ALCODE_HOME: ${{ runner.temp }}/alcode-home
        run: pnpm gate:0.1A
      - name: Typecheck + test workspace, storage, and secrets packages
        run: |
          pnpm --filter @alcode/workspace exec tsc --noEmit -p tsconfig.json
          pnpm --filter @alcode/storage exec tsc --noEmit -p tsconfig.json
          pnpm --filter @alcode/secrets exec tsc --noEmit -p tsconfig.json
          pnpm --filter @alcode/workspace exec vitest run
          pnpm --filter @alcode/storage exec vitest run
          pnpm --filter @alcode/secrets exec vitest run
      - name: Run Phase 0.2 gate
        env:
          ALCODE_HOME: ${{ runner.temp }}/alcode-home
        run: pnpm gate:0.2

  gate-0-1B:
    name: Phase 0.1B gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: pnpm
      - name: Install (Linux/macOS)
        if: runner.os != 'Windows'
        run: pnpm install --no-frozen-lockfile
      - name: Install (Windows — skip native builds)
        if: runner.os == 'Windows'
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Run Phase 0.1B gate
        env:
          ALCODE_HOME: ${{ runner.temp }}/alcode-home
        run: pnpm gate:0.1B

  gate-0-3:
    name: Phase 0.3 gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: pnpm
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Run Phase 0.3 gate
        env:
          ALCODE_HOME: ${{ runner.temp }}/alcode-home
        run: pnpm gate:0.3

  gate-0-4:
    name: Phase 0.4 gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: pnpm
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Run Phase 0.4 gate
        env:
          ALCODE_HOME: ${{ runner.temp }}/alcode-home
        run: pnpm gate:0.4

  phase-0-5-dev:
    name: Phase 0.5 development checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: pnpm
      - name: Install and refresh workspace lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck Phase 0.5 surfaces
        run: |
          pnpm --filter @alcode/agent-protocol typecheck
          pnpm --filter @alcode/cognition-runtime typecheck
          pnpm --filter @alcode/host-runtime typecheck
          pnpm --filter @alcode/cognition-extension typecheck
          pnpm --filter @alcode/reasoning typecheck
          pnpm --filter @alcode/storage typecheck
          pnpm --filter @alcode/coding-agent typecheck
      - name: Run current Phase 0.5 tests from repository root
        run: |
          pnpm exec vitest run \
            packages/agent-protocol/src \
            packages/cognition-runtime/src \
            packages/host-runtime/src \
            packages/coding-agent/src/agent-replacement.integration.test.ts
      - name: Upload refreshed lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-0.5-pnpm-lock
          path: pnpm-lock.yaml
