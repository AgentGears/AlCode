name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-0-0:
    name: Phase 0.0 gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # esbuild (vitest's dep) needs its postinstall to run; CI installs are
      # trusted, so allow it.
      - name: Rebuild esbuild
        run: pnpm rebuild esbuild

      - name: Run Phase 0.0 gate
        env:
          ALCODE_HOME: ${{ runner.temp }}/alcode-home
        run: pnpm gate:0.0
