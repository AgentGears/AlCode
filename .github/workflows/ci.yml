name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate-0-0:
    name: Phase 0.0 gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Run Phase 0.0 gate
        env:
          ALCODE_HOME: ${{ runner.temp }}/alcode-home
        run: pnpm gate:0.0
      - name: Run Phase 0.1A gate
        env:
          ALCODE_HOME: ${{ runner.temp }}/alcode-home
        run: pnpm gate:0.1A
      - name: Typecheck + test workspace, storage, and secrets packages
        run: |
          pnpm --filter @alcode/workspace exec tsc --noEmit -p tsconfig.json
          pnpm --filter @alcode/storage exec tsc --noEmit -p tsconfig.json
          pnpm --filter @alcode/secrets exec tsc --noEmit -p tsconfig.json
          pnpm --filter @alcode/workspace exec vitest run
          pnpm --filter @alcode/storage exec vitest run
          pnpm --filter @alcode/secrets exec vitest run
      - name: Run Phase 0.2 gate
        env:
          ALCODE_HOME: ${{ runner.temp }}/alcode-home
        run: pnpm gate:0.2

  gate-0-1B:
    name: Phase 0.1B gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: pnpm
      - name: Install (Linux/macOS)
        if: runner.os != 'Windows'
        run: pnpm install --frozen-lockfile
      - name: Install (Windows — skip native builds)
        if: runner.os == 'Windows'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run Phase 0.1B gate
        env:
          ALCODE_HOME: ${{ runner.temp }}/alcode-home
        run: pnpm gate:0.1B

  gate-0-3:
    name: Phase 0.3 gate
    runs-on: ubuntu-latest
    steps:
