name: Temporary Phase 1 artifact verification

on:
  push:
    branches:
      - automation/phase-1.0-artifact-verification-build

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Preserve builder and create nested branch
        run: |
          cp .github/scripts/_temp-phase1-artifact-verification.py /tmp/artifact-verification.py
          git fetch origin feat/phase-1.0-path-verification
          git checkout -b feat/phase-1.0-artifact-verification origin/feat/phase-1.0-path-verification
      - name: Apply bounded artifact verification slice
        run: python /tmp/artifact-verification.py
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @alcode/host-runtime typecheck
      - name: Focused tests
        run: |
          pnpm exec vitest run packages/host-runtime/src/program-verification.test.ts packages/host-runtime/src/program-dispatch.test.ts packages/host-runtime/src/program-recovery.test.ts packages/host-runtime/src/artifact-store.test.ts
      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/host-runtime/src/program-verification.ts packages/host-runtime/src/program-verification.test.ts packages/host-runtime/src/capability-broker.ts packages/host-runtime/src/artifact-store.ts packages/host-runtime/src/index.ts
          git commit -m "feat(1.0): bind and verify Program artifacts"
          git push origin feat/phase-1.0-artifact-verification
