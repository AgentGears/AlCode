name: Temporary Phase 1 recovery barrier v7

on:
  push:
    branches:
      - automation/phase-1.0-recovery-barrier-build-v7

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Preserve builders and create clean feature branch
        run: |
          cp .github/scripts/_temp-phase1-recovery.py /tmp/phase1-recovery.py
          cp .github/scripts/_temp-phase1-recovery-corrections.py /tmp/phase1-recovery-corrections.py
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/phase1-recovery.py')
          s = p.read_text()
          old = "    'import { DefaultHostPolicy, type HostPolicy } from \"./policy.ts\";\\n',\n    'import { DefaultHostPolicy, type HostPolicy } from \"./policy.ts\";\\nimport type { WorkspaceMutationAdmissionAuthorityV1 } from \"./program-recovery.ts\";\\n',"
          new = "    'import type { HostPolicy } from \"./policy.ts\";\\n',\n    'import type { HostPolicy } from \"./policy.ts\";\\nimport type { WorkspaceMutationAdmissionAuthorityV1 } from \"./program-recovery.ts\";\\n',"
          if old not in s:
              raise SystemExit('builder import correction target missing')
          s = s.replace(old, new, 1)
          target = '  asProgramStateId as asEventProgramStateId,\n'
          if target not in s:
              raise SystemExit('operation id import target missing')
          s = s.replace(target, '  asOperationId,\n  asProgramStateId as asEventProgramStateId,\n', 1)
          if 'operationId: request.event.operationId,' not in s:
              raise SystemExit('operation id draft targets missing')
          s = s.replace('operationId: request.event.operationId,', 'operationId: asOperationId(request.operationId),')
          p.write_text(s)

          p = Path('/tmp/phase1-recovery-corrections.py')
          s = p.read_text()
          needle = 's = replace_once(s, old, new, "refresh stale mismatch receipt")'
          replacement = '''if old in s:\n    s = s.replace(old, new, 1)\nelse:\n    start = s.index('        if (state.executionBaseMismatch !== null) {')\n    end = s.index('\\n\\n        if (sameBase(state.acceptedExecutionBase, currentBase)) {', start)\n    s = s[:start] + new.rstrip('\\n') + s[end:]'''
          if needle not in s:
              raise SystemExit('mismatch correction script target missing')
          p.write_text(s.replace(needle, replacement, 1))
          PY
          git fetch origin main
          git checkout -b feat/phase-1.0-recovery-barrier-v2 origin/main
      - name: Apply recovery slice
        run: |
          python /tmp/phase1-recovery.py
          python /tmp/phase1-recovery-corrections.py
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: |
          pnpm --filter @alcode/storage typecheck
          pnpm --filter @alcode/host-runtime typecheck
      - name: Focused tests
        run: |
          pnpm exec vitest run packages/storage/src/operations.test.ts packages/storage/src/recovery.test.ts packages/host-runtime/src/program-recovery.test.ts packages/host-runtime/src/program-dispatch.test.ts packages/host-runtime/src/program-operation-correlation.test.ts packages/host-runtime/src/recovery.integration.test.ts packages/host-runtime/src/host-runtime.integration.test.ts
      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/host-runtime/src/capability-broker.ts packages/host-runtime/src/host.ts packages/host-runtime/src/index.ts packages/host-runtime/src/program-recovery.ts packages/host-runtime/src/program-recovery.test.ts
          git commit -m "feat(1.0): recover workspace execution authority"
          git push origin feat/phase-1.0-recovery-barrier-v2
