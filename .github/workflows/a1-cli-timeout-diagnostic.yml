name: A1 CLI Timeout Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/a1-cli-timeout-diagnostic.yml'
      - 'packages/coding-agent/src/cli-program.integration.test.ts'
      - 'packages/coding-agent/src/cli.ts'
      - 'packages/coding-agent/src/agent-worker.ts'
      - 'packages/host-runtime/src/agent-supervisor.ts'
      - 'packages/host-runtime/src/node-ipc-transport.ts'

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ensure strace is available
        run: command -v strace >/dev/null || (sudo apt-get update && sudo apt-get install -y strace)
      - name: Reproduce and classify accepted CLI timeout
        shell: bash
        run: |
          set +e
          strace -f -tt -T -s 200 \
            -e trace=process,signal,desc,file \
            -o /tmp/alcode-cli-timeout.strace \
            pnpm exec vitest run packages/coding-agent/src/cli-program.integration.test.ts
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo '--- strace tail ---'
            tail -n 1600 /tmp/alcode-cli-timeout.strace || true
            echo '--- end strace tail ---'
          fi
          exit "$status"
