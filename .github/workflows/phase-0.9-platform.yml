name: Phase 0.9 platform proof
on:
  push:
    branches: [phase-0.9]
  pull_request:
    paths:
      - 'packages/plugins/**'
      - 'packages/host-runtime/src/external-process*'
      - 'packages/host-runtime/src/plugin-service*'
      - '.github/workflows/phase-0.9-platform.yml'
jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.13.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.17.0, cache: pnpm }
      - name: Install (Linux/macOS)
        if: runner.os != 'Windows'
        run: pnpm install --frozen-lockfile
      - name: Install (Windows — skip native builds)
        if: runner.os == 'Windows'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec vitest run packages/plugins/src/plugins.test.ts packages/host-runtime/src/plugin-service.test.ts packages/host-runtime/src/external-process.test.ts
