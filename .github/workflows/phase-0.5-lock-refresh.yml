name: Phase 0.5 lockfile refresh

on:
  push:
    branches: [phase-0.5/host-runtime-cognition]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 0.5 branch
        uses: actions/checkout@v4
        with:
          ref: phase-0.5/host-runtime-cognition
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
      - name: Refresh lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit refreshed lockfile if needed
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "phase 0.5: refresh pnpm lockfile"
          git push origin HEAD:phase-0.5/host-runtime-cognition
