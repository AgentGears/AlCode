\n  omissions: { verification: number; blockers: number; evidence: number; artifacts: number };\n  stopConditions: {\n    attemptMustRemainCurrent: true;\n    rebaseRequiredOnExecutionBaseMismatch: true;\n    hostOwnsVerificationAndCompletion: true;\n  };\n}\n\n'''
