          Path('packages/host-runtime/src/program-agent.test.ts').write_text(r'''import { mkdtempSync, rmSync } from "node:fs";
import { tmpdir } from "node:os";
import { join } from "node:path";
import { afterEach, describe, expect, it } from "vitest";
import { asProgramStateId as asEventProgramStateId, asWorkspaceId, mkEventId, mkProgramStateId, uuidv7 } from "@alcode/events";
import { asProgramStateId, asProgramWorkItemId, asSessionId, createProgramState, type ProgramAttemptExecutionBase, type ProgramState } from "@alcode/program-state";
import { openLockedWorkspaceStore, type LockedWorkspaceStore } from "@alcode/storage";
import { CanonicalAdmissionQueue } from "./admission-queue.ts";
import { ProgramAgentServiceV1, PROGRAM_ATTEMPT_PROJECTION_MAX_BYTES } from "./program-agent.ts";
import { ProgramDispatchServiceV1 } from "./program-dispatch.ts";
import { HostSessionManager } from "./session-manager.ts";

const describeLocked = process.platform === "win32" ? describe.skip : describe;
const stores: LockedWorkspaceStore[] = [];
const dirs: string[] = [];
afterEach(() => { for (const store of stores.splice(0)) { try { store.close(); } catch {} } for (const dir of dirs.splice(0)) rmSync(dir, { recursive: true, force: true }); });

function base(workspaceIdentity: string): ProgramAttemptExecutionBase { return { workspaceEffectGeneration: 0, observation: { kind: "workspace-observation-v1", providerKind: "program-agent-test", workspaceIdentity, coverageDigest: "coverage", stateDigest: "state" } }; }
async function latestState(store: LockedWorkspaceStore, id: string): Promise<ProgramState> { let latest: ProgramState | undefined; for await (const event of store.store.replay()) if (String(event.programStateId ?? "") === id && ["program.created","program.transitioned","program.completed","program.cancelled"].includes(event.type)) latest = (event.payload as { state: ProgramState }).state; if (!latest) throw new Error("missing state"); return latest; }

async function setup() {
  const dir = mkdtempSync(join(tmpdir(), "alcode-program-agent-")); dirs.push(dir);
  const locked = await openLockedWorkspaceStore({ databasePath: join(dir,"workspace.sqlite"), lockPath: join(dir,"workspace.lock"), workspaceId: asWorkspaceId(uuidv7()), repositoryId: uuidv7() }); stores.push(locked);
  const admission = new CanonicalAdmissionQueue(locked.store);
  const sessions = new HostSessionManager(locked, admission);
  const session = await sessions.openOrResume();
  const workItemId = asProgramWorkItemId("work-agent");
  const initial = createProgramState({ programStateId: asProgramStateId(String(mkProgramStateId())), sourceSessionId: asSessionId(String(session.sessionId)), objective: "Continue durable work", workItems: [{ workItemId, creationOrder: 0, description: "Implement current slice", dependencyIds: [], affectedPaths: ["src/a.ts"] }], verification: [], outputSlots: [], productionSteps: [] });
  await admission.append([{ eventId: mkEventId(), workspaceId: asWorkspaceId(locked.store.workspaceId), sessionId: session.sessionId, programStateId: asEventProgramStateId(String(initial.programStateId)), occurredAt: new Date().toISOString(), type: "program.created", payload: { state: initial }, payloadSchemaVersion: 1, producer: { kind: "runtime", component: "program-agent-test" } }]);
  const agents = new ProgramAgentServiceV1(locked.store, admission);
  const currentBase = base(locked.store.workspaceId);
  const dispatch = new ProgramDispatchServiceV1({ store: locked.store, admission, workspaceCoordinator: { runExclusive: (work) => work() }, observations: { observe: async () => ({ status: "complete" as const, base: currentBase }) }, agentGenerations: agents, recovery: { isClear: () => true }, firstDispatchPlanning: { recheckAcceptedPlanningBase: async () => undefined } });
  return { locked, session, initial, workItemId, agents, dispatch };
}

describeLocked("Program Agent authority", () => {
  it("projects only the current Agent generation and interrupts an Attempt on replacement", async () => {
    const f = await setup();
    const generation1 = await f.agents.attach(f.session.sessionId, "connection-1", true);
    const issued = await f.dispatch.issueAttempt({ programStateId: String(f.initial.programStateId), expectedProgramRevision: f.initial.revision, workItemId: String(f.workItemId), sessionId: f.session.sessionId, agentGeneration: generation1 });
    expect(issued.status).toBe("issued"); if (issued.status !== "issued") throw new Error("attempt not issued");
    const projection = await f.agents.currentAttemptProjection(f.session.sessionId, "connection-1");
    expect(projection?.authority).toMatchObject({ programStateId: String(f.initial.programStateId), programAttemptId: issued.programAttemptId, agentGeneration: generation1 });
    expect(Buffer.byteLength(JSON.stringify(projection), "utf8")).toBeLessThanOrEqual(PROGRAM_ATTEMPT_PROJECTION_MAX_BYTES);

    const generation2 = await f.agents.attach(f.session.sessionId, "connection-2", true);
    expect(generation2).toBeGreaterThan(generation1);
    expect(f.agents.isCurrent(String(f.session.sessionId), generation1)).toBe(false);
    expect(f.agents.isCurrent(String(f.session.sessionId), generation2)).toBe(true);
    expect((await latestState(f.locked, String(f.initial.programStateId))).activeAttempt).toBeNull();
    expect(await f.agents.currentAttemptProjection(f.session.sessionId, "connection-2")).toBeUndefined();
  });

  it("does not expose Program projection to a legacy Agent", async () => {
    const f = await setup();
    const generation = await f.agents.attach(f.session.sessionId, "legacy", false);
    const issued = await f.dispatch.issueAttempt({ programStateId: String(f.initial.programStateId), expectedProgramRevision: f.initial.revision, workItemId: String(f.workItemId), sessionId: f.session.sessionId, agentGeneration: generation });
    expect(issued.status).toBe("issued");
    expect(await f.agents.currentAttemptProjection(f.session.sessionId, "legacy")).toBeUndefined();
  });
});
''')
