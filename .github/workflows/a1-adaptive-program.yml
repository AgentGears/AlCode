jobs:
  semantic-revision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.13.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.17.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Typecheck frozen semantic Program kernel
        run: pnpm --filter @alcode/program-state exec tsc --noEmit -p tsconfig.json
      - name: Verify semantic kernel and atomic revision transaction
        run: pnpm --filter @alcode/program-state exec vitest run src/semantic-a1.test.ts src/revision-a1.test.ts
      - name: Typecheck additive Application semantic authority
        run: pnpm --filter @alcode/application-protocol exec tsc --noEmit -p tsconfig.json
      - name: Verify Application semantic command parsing and adaptive transport forwarding
        run: pnpm exec vitest run packages/application-protocol/src/program-validation.test.ts packages/application-protocol/src/loopback-adaptive.test.ts
      - name: Typecheck negotiated Agent protocol V2 boundary
        run: pnpm --filter @alcode/agent-protocol exec tsc --noEmit -p tsconfig.json
      - name: Verify V2 wire schemas, negotiated routing, and semantic revision protocol
        run: pnpm exec vitest run packages/agent-protocol/src/program-execution-v2.test.ts packages/agent-protocol/src/program-execution-v2-routing.test.ts packages/agent-protocol/src/program-revision-v1.test.ts
      - name: Typecheck cognition and coding-Agent V2 propagation
        run: |
          pnpm --filter @alcode/cognition-extension exec tsc --noEmit -p tsconfig.json
          pnpm --filter @alcode/coding-agent exec tsc --noEmit -p tsconfig.json
      - name: Verify Agent bridge, semantic revision client/planner, and production wiring
        run: pnpm exec vitest run packages/coding-agent/src/agent-protocol-bridge-v2.test.ts packages/coding-agent/src/program-revision-protocol-client-v1.test.ts packages/coding-agent/src/program-revision-planner.test.ts packages/coding-agent/src/program-revision-production-wiring.test.ts packages/coding-agent/src/adaptive-production-cli-wiring.test.ts
      - name: Typecheck Host semantic admission, recovery, projection, Application acceptance, eligibility, Completion, baseline adoption, and adaptive V2 execution
        run: pnpm --filter @alcode/host-runtime exec tsc --noEmit -p tsconfig.json
      - name: Verify Host semantic admission, recovery, projection, Application acceptance, baseline/revision production wiring, eligibility, Completion, V2 authority, and adaptive execution routing
        run: pnpm exec vitest run packages/host-runtime/src/program-revision.test.ts packages/host-runtime/src/program-revision-race.test.ts packages/host-runtime/src/program-revision-protocol-v1.test.ts packages/host-runtime/src/program-revision-runtime-v1.test.ts packages/host-runtime/src/program-semantic-recovery-v1.test.ts packages/host-runtime/src/program-semantic-recovery-currentness-v1.test.ts packages/host-runtime/src/program-semantic-recovery-review-regressions-v1.test.ts packages/host-runtime/src/program-semantic-recovery-envelope-regression-v1.test.ts packages/host-runtime/src/program-semantic-baseline-recovery-regression-v1.test.ts packages/host-runtime/src/program-recovery-adaptive-authority.test.ts packages/host-runtime/src/program-adaptive-application-projection-v1.test.ts packages/host-runtime/src/program-adaptive-application-control-v1.test.ts packages/host-runtime/src/plugin-application-service-adaptive.test.ts packages/host-runtime/src/program-attempt-authority-v2.test.ts packages/host-runtime/src/program-agent-v2.test.ts packages/host-runtime/src/program-agent-v2-replay.test.ts packages/host-runtime/src/program-execution-runtime-v2.test.ts packages/host-runtime/src/program-adaptive-control-v2.test.ts packages/host-runtime/src/program-adaptive-operational-v2.test.ts packages/host-runtime/src/program-adaptive-admission-v2.test.ts packages/host-runtime/src/program-adaptive-progress-v2.test.ts packages/host-runtime/src/program-adaptive-operation-v2.test.ts packages/host-runtime/src/program-adaptive-verification-control-v2.test.ts packages/host-runtime/src/program-adaptive-session-classifier-v1.test.ts packages/host-runtime/src/program-adaptive-production-v1.test.ts packages/host-runtime/src/program-adaptive-production-application-wiring.test.ts packages/host-runtime/src/program-semantic-baseline.test.ts
