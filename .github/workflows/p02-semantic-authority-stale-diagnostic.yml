name: P-02 semantic authority stale diagnostic

"on":
  push:
    branches:
      - feat/p02-semantic-planning-v1

permissions:
  contents: read

jobs:
  diagnose-stale-recheck:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p02-semantic-planning-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply candidate authority corrections
        run: |
          python scripts/p02-semantic-authority-review-closure.py
          python scripts/p02-semantic-symbol-cache-correction.py
          python scripts/p02-semantic-authority-host-bridge.py

      - name: Add bounded stale-recheck diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              if old not in source:
                  raise SystemExit(f"{label} anchor not found")
              return source.replace(old, new, 1)

          tracker = Path("packages/code-intelligence/src/tracker.ts")
          source = tracker.read_text()
          source = replace_once(
              source,
              '        if (filename && this.isIgnored(String(filename))) return;\n',
              '        if (filename && this.isIgnored(String(filename))) return;\n'
              '        if (process.env.ALCODE_P02_AUTHORITY_DIAG === "1") {\n'
              '          console.error("[p02-authority-tracker-event]", JSON.stringify({ filename: filename === null ? null : String(filename), state: this.state, generation: this.generation }));\n'
              '        }\n',
              'tracker watcher diagnostic',
          )
          tracker.write_text(source)

          service = Path("packages/code-intelligence/src/service.ts")
          source = service.read_text()
          source = replace_once(
              source,
              '    const before = this.options.tracker.snapshot();\n',
              '    const before = this.options.tracker.snapshot();\n'
              '    if (process.env.ALCODE_P02_AUTHORITY_DIAG === "1") console.error("[p02-authority-query-before]", JSON.stringify({ request, before }));\n',
              'service before diagnostic',
          )
          source = replace_once(
              source,
              '    const after = this.options.tracker.snapshot();\n',
              '    const after = this.options.tracker.snapshot();\n'
              '    if (process.env.ALCODE_P02_AUTHORITY_DIAG === "1") console.error("[p02-authority-query-after]", JSON.stringify({ type: request.type, revision, after, providerComplete: result.complete, result: result.value }));\n',
              'service after diagnostic',
          )
          service.write_text(source)

          planning = Path("packages/host-runtime/src/planning-read.ts")
          source = planning.read_text()
          source = replace_once(
              source,
              '      const actual = current.dependency;\n',
              '      const actual = current.dependency;\n'
              '      if (process.env.ALCODE_P02_AUTHORITY_DIAG === "1") console.error("[p02-authority-recheck]", JSON.stringify({ readContractId: dependency.readContractId, sealed: dependency, actual }));\n',
              'planning recheck diagnostic',
          )
          planning.write_text(source)
          PY

      - name: Run P-02 product stale diagnostic
        env:
          ALCODE_P02_AUTHORITY_DIAG: "1"
        run: pnpm exec vitest run packages/coding-agent/src/cli-p02-semantic-retry.integration.test.ts --reporter=verbose
