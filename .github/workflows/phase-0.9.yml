name: Phase 0.9
on:
  pull_request:
    paths:
      - '.github/workflows/phase-0.9.yml'
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.13.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.17.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Verbose coding-agent suite
        run: pnpm exec vitest run packages/coding-agent/src --reporter=verbose
