name: Phase 0.9
on:
  pull_request:
    paths:
      - '.github/workflows/phase-0.9.yml'
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.13.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.17.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Deterministic production CLI
        env:
          ALCODE_AGENT_SCRIPT: '[{"text":"Hello from ALCODE. The agent loop is running."}]'
          ALCODE_PLANNING_SCRIPT: '[{"toolCalls":[{"id":"planning-proposal-1","name":"submit_program_proposal","arguments":{"objective":"hello","workItems":[{"workItemId":"work-1","creationOrder":0,"description":"hello","dependencyIds":[],"affectedPaths":["package.json"]}],"verification":[{"obligationId":"verify-package-json","verifier":{"specId":"workspace_path_state","specVersion":1},"args":{"path":"package.json","requiredState":"file"},"freshnessScope":{"kind":"workspace"}}],"outputSlots":[],"productionSteps":[]}}]}]'
        run: |
          set +e
          timeout 330s pnpm exec tsx packages/coding-agent/src/cli.ts -p hello --accept-program > /tmp/alcode-cli.out 2> /tmp/alcode-cli.err
          status=$?
          echo '--- STDOUT ---'
          cat /tmp/alcode-cli.out
          echo '--- STDERR ---'
          cat /tmp/alcode-cli.err
          echo "--- EXIT STATUS: ${status} ---"
          exit "$status"
