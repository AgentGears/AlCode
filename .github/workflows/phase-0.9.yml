name: Phase 0.9
on:
  pull_request:
    paths:
      - '.github/workflows/phase-0.9*.yml'
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.13.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.17.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Instrument adaptive idle decision in checked-out source only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/host-runtime/src/program-execution-runtime-v2.ts')
          text = path.read_text()
          old = 'const decision = await this.control.handleAgentIdle(sessionId);'
          new = '''const decision = await this.control.handleAgentIdle(sessionId).then(
              (value) => {
                console.error(`ALCODE_DIAG_IDLE_DECISION=${JSON.stringify(value)}`);
                return value;
              },
              (error) => {
                console.error(`ALCODE_DIAG_IDLE_ERROR=${error instanceof Error ? `${error.name}: ${error.message}` : String(error)}`);
                throw error;
              },
            );'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one idle decision call, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Run deterministic accepted CLI with idle diagnostics
        env:
          ALCODE_HOME: ${{ runner.temp }}/alcode-idle-diag
          ALCODE_AGENT_SCRIPT: '[{"text":"Hello from ALCODE. The agent loop is running."}]'
          ALCODE_PLANNING_SCRIPT: '[{"toolCalls":[{"id":"planning-proposal-1","name":"submit_program_proposal","arguments":{"objective":"hello","workItems":[{"workItemId":"work-1","creationOrder":0,"description":"hello","dependencyIds":[],"affectedPaths":["package.json"]}],"verification":[{"obligationId":"verify-package-json","verifier":{"specId":"workspace_path_state","specVersion":1},"args":{"path":"package.json","requiredState":"file"},"freshnessScope":{"kind":"workspace"}}],"outputSlots":[],"productionSteps":[]}}]}]'
        run: |
          set +e
          timeout 30s pnpm exec tsx packages/coding-agent/src/cli.ts -p hello --accept-program > /tmp/alcode-cli.out 2> /tmp/alcode-cli.err
          status=$?
          echo "CLI_STATUS=$status"
          echo '--- STDOUT ---'
          cat /tmp/alcode-cli.out
          echo '--- STDERR ---'
          cat /tmp/alcode-cli.err
          exit 0
