name: P-02 Agent Exit Diagnostic

"on":
  push:
    branches:
      - feat/p02-semantic-planning-v1

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p02-semantic-planning-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply pending P-02 corrections
        run: |
          python scripts/p02-effect-absence-patch.py
          python scripts/p02-replay-cursor-fix.py
          python scripts/p02-post-verifier-diagnostic.py
          python scripts/p02-verification-singleflight-deadlock-patch.py
          python scripts/p02-adaptive-effect-absence-patch.py
      - name: Add bounded product diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          test = Path("packages/coding-agent/src/cli-p02-semantic-retry.integration.test.ts")
          source = test.read_text().replace("      timeout: 20_000,", "      timeout: 12_000,", 1)
          anchor = "    const events = await replay(home, root);"
          replacement = "    process.stderr.write(result.stderr ?? \"\");\n    process.stdout.write(result.stdout ?? \"\");\n" + anchor
          if anchor not in source:
              raise SystemExit("P-02 product diagnostic anchor not found")
          source = source.replace(anchor, replacement, 1)
          old = "\n".join([
              "    const verificationRequests = events.filter((event) => {",
              "      if (event.type !== \"operation.requested\") return false;",
              "      const invocation = record(record(event.payload).programVerificationInvocation);",
              "      return invocation.specId === \"package_typecheck\";",
              "    });",
          ])
          new = "\n".join([
              "    const verificationRequests = events.filter((event) => {",
              "      if (event.type !== \"operation.requested\") return false;",
              "      const invocation = record(event.payload).programVerificationInvocation;",
              "      if (typeof invocation !== \"object\" || invocation === null || Array.isArray(invocation)) return false;",
              "      return record(invocation).specId === \"package_typecheck\";",
              "    });",
          ])
          if old not in source:
              raise SystemExit("P-02 verification request filter anchor not found")
          test.write_text(source.replace(old, new, 1))
          PY
      - name: Run P-02 product vertical diagnostic
        run: pnpm exec vitest run packages/coding-agent/src/cli-p02-semantic-retry.integration.test.ts --reporter=verbose
