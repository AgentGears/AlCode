name: Temporary Phase 1 Program creation review fixes

on:
  push:
    branches:
      - feat/phase-1.0-program-creation

permissions:
  contents: write

jobs:
  fix-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-1.0-program-creation
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: pnpm
      - name: Apply bounded review corrections
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          # 1) Tracked planning: Host registry-issued trackers + no sealing with reads in flight.
          path = Path("packages/host-runtime/src/planning-read.ts")
          text = path.read_text()
          text = replace_once(
              text,
              'export class PlanningReadRegistry {\n  private readonly contracts = new Map<string, PlanningReadContractV1>();\n',
              'export class PlanningReadRegistry {\n  private readonly contracts = new Map<string, PlanningReadContractV1>();\n  private readonly issuedTrackers = new WeakSet<TrackedPlanningReads>();\n',
              "planning registry tracker set",
          )
          text = replace_once(
              text,
              '  get(readContractId: string, readContractVersion: number): PlanningReadContractV1 {\n',
              '  track(workspaceIdentity: string): TrackedPlanningReads {\n    const tracker = new TrackedPlanningReads(this, workspaceIdentity);\n    this.issuedTrackers.add(tracker);\n    return tracker;\n  }\n\n  isIssuedTracker(tracker: TrackedPlanningReads): boolean {\n    return this.issuedTrackers.has(tracker);\n  }\n\n  get(readContractId: string, readContractVersion: number): PlanningReadContractV1 {\n',
              "planning registry tracker methods",
          )
          text = replace_once(
              text,
              'export class TrackedPlanningReads {\n  private readonly dependencies: PlanningReadDependencyV1[] = [];\n  private sealed = false;\n',
              'export class TrackedPlanningReads {\n  private readonly dependencies: PlanningReadDependencyV1[] = [];\n  private sealed = false;\n  private inFlight = 0;\n',
              "planning in-flight state",
          )
          old_read = '''  async read(\n    readContractId: string,\n    readContractVersion: number,\n    input: Json,\n  ): Promise<Json> {\n    if (this.sealed) throw new PlanningReadError("Planning dependency set is already sealed");\n    const delivery = await this.registry.read(readContractId, readContractVersion, input);\n    this.dependencies.push(delivery.dependency);\n    if (this.dependencies.length > PLANNING_PROVENANCE_LIMITS.dependencies) {\n      throw new PlanningReadError(\n        `Planning dependency count exceeds ${PLANNING_PROVENANCE_LIMITS.dependencies}`,\n      );\n    }\n    return delivery.result;\n  }\n\n  seal(): PlanningObservationIdentityV1 {\n    if (this.sealed) throw new PlanningReadError("Planning dependency set is already sealed");\n    this.sealed = true;\n'''
          new_read = '''  async read(\n    readContractId: string,\n    readContractVersion: number,\n    input: Json,\n  ): Promise<Json> {\n    if (this.sealed) throw new PlanningReadError("Planning dependency set is already sealed");\n    this.inFlight += 1;\n    try {\n      const delivery = await this.registry.read(readContractId, readContractVersion, input);\n      if (this.sealed) {\n        throw new PlanningReadError("Planning dependency set was sealed while a semantic read was in flight");\n      }\n      this.dependencies.push(delivery.dependency);\n      if (this.dependencies.length > PLANNING_PROVENANCE_LIMITS.dependencies) {\n        throw new PlanningReadError(\n          `Planning dependency count exceeds ${PLANNING_PROVENANCE_LIMITS.dependencies}`,\n        );\n      }\n      return delivery.result;\n    } finally {\n      this.inFlight -= 1;\n    }\n  }\n\n  seal(): PlanningObservationIdentityV1 {\n    if (this.sealed) throw new PlanningReadError("Planning dependency set is already sealed");\n    if (this.inFlight !== 0) {\n      throw new PlanningReadError("Cannot seal planning dependencies while semantic reads are in flight");\n    }\n    this.sealed = true;\n'''
          text = replace_once(text, old_read, new_read, "planning read/seal linearization")
          path.write_text(text)

          # 2) Program creation: only Host-issued trackers may be sealed; bind objective to caller event.
          path = Path("packages/host-runtime/src/program-creation.ts")
          text = path.read_text()
          text = replace_once(
              text,
              '  PlanningReadRegistry,\n  assertPlanningObservationIdentity,\n',
              '  PlanningReadRegistry,\n  TrackedPlanningReads,\n  assertPlanningObservationIdentity,\n',
              "program creation tracker import",
          )
          text = replace_once(text, '  sourceEventId?: string;\n', '  sourceEventId: string;\n', "objective source event required")
          text = replace_once(
              text,
              '  if (draft.objectiveProvenance.sourceSessionId !== draft.sourceSessionId) {\n    throw new ProgramCreationControlError("Objective provenance source session does not match draft source session");\n  }\n  if (draft.objectiveProvenance.objectiveDigest !== planningCanonicalDigest(draft.proposal.objective)) {\n',
              '  if (draft.objectiveProvenance.sourceSessionId !== draft.sourceSessionId) {\n    throw new ProgramCreationControlError("Objective provenance source session does not match draft source session");\n  }\n  requireNonEmpty("objectiveProvenance.sourceEventId", draft.objectiveProvenance.sourceEventId);\n  if (draft.objectiveProvenance.objectiveDigest !== planningCanonicalDigest(draft.proposal.objective)) {\n',
              "objective provenance validation",
          )
          helper = '''\nfunction resolveObjectiveProvenance(\n  events: readonly PersistedDomainEvent<string, unknown>[],\n  sourceSessionId: string,\n  objective: string,\n  requestedEventId?: string,\n): ProgramObjectiveProvenanceV1 {\n  let source: PersistedDomainEvent<string, unknown> | undefined;\n  if (requestedEventId !== undefined) {\n    source = events.find((event) => String(event.eventId) === requestedEventId);\n    if (source === undefined) {\n      throw new ProgramCreationStaleError(`Unknown source objective event ${requestedEventId}`);\n    }\n  } else {\n    for (let index = events.length - 1; index >= 0; index -= 1) {\n      const candidate = events[index]!;\n      if (candidate.type !== "user.message.appended") continue;\n      if (String(candidate.sessionId) !== sourceSessionId) continue;\n      if (record(candidate.payload).text !== objective) continue;\n      source = candidate;\n      break;\n    }\n    if (source === undefined) {\n      throw new ProgramCreationStaleError("No caller-authored source objective event matches the Program objective");\n    }\n  }\n\n  if (source.type !== "user.message.appended" || String(source.sessionId) !== sourceSessionId) {\n    throw new ProgramCreationStaleError("Source objective event is not a caller message for the source session");\n  }\n  if (record(source.payload).text !== objective) {\n    throw new ProgramCreationStaleError("Program objective does not match the caller-authored source objective event");\n  }\n\n  return {\n    kind: "application-objective-v1",\n    sourceSessionId,\n    sourceEventId: String(source.eventId),\n    objectiveDigest: planningCanonicalDigest(objective),\n  };\n}\n'''
          marker = '\nfunction reduceDraftControls(\n'
          if marker not in text:
              raise SystemExit("objective provenance helper marker missing")
          text = text.replace(marker, helper + marker, 1)
          old_sig = '''  async sealDraft(input: {\n    sourceSessionId: SessionId;\n    proposal: ProgramCreationProposalV1;\n    planningObservationIdentity: PlanningObservationIdentityV1;\n    sourceObjectiveEventId?: string;\n  }): Promise<ProgramCreationDraftV1> {\n    assertPlanningObservationIdentity(input.planningObservationIdentity);\n    if (input.planningObservationIdentity.workspaceIdentity !== this.options.store.workspaceId) {\n      throw new ProgramCreationControlError("Planning identity belongs to another Workspace");\n    }\n\n    return this.options.admission.enqueue(async () => {\n'''
          new_sig = '''  async sealDraft(input: {\n    sourceSessionId: SessionId;\n    proposal: ProgramCreationProposalV1;\n    planningReads: TrackedPlanningReads;\n    sourceObjectiveEventId?: string;\n  }): Promise<ProgramCreationDraftV1> {\n    if (!this.options.planningReads.isIssuedTracker(input.planningReads)) {\n      throw new ProgramCreationControlError("Planning tracker was not issued by the Host planning-read registry");\n    }\n    const planningObservationIdentity = input.planningReads.seal();\n    assertPlanningObservationIdentity(planningObservationIdentity);\n    if (planningObservationIdentity.workspaceIdentity !== this.options.store.workspaceId) {\n      throw new ProgramCreationControlError("Planning identity belongs to another Workspace");\n    }\n\n    return this.options.admission.enqueue(async () => {\n'''
          text = replace_once(text, old_sig, new_sig, "Host-issued planning tracker seal")
          old_obj = '''      const objectiveProvenance: ProgramObjectiveProvenanceV1 = {\n        kind: "application-objective-v1",\n        sourceSessionId,\n        ...(input.sourceObjectiveEventId !== undefined ? { sourceEventId: input.sourceObjectiveEventId } : {}),\n        objectiveDigest: planningCanonicalDigest(input.proposal.objective),\n      };\n'''
          new_obj = '''      const objectiveProvenance = resolveObjectiveProvenance(\n        events,\n        sourceSessionId,\n        input.proposal.objective,\n        input.sourceObjectiveEventId,\n      );\n'''
          text = replace_once(text, old_obj, new_obj, "objective provenance resolution")
          text = replace_once(
              text,
              '        planningObservationIdentity: input.planningObservationIdentity,\n',
              '        planningObservationIdentity,\n',
              "sealed planning identity binding",
          )
          path.write_text(text)

          # 3) Planning-read regression: sealing cannot omit an in-flight semantic read.
          path = Path("packages/host-runtime/src/planning-read.test.ts")
          text = path.read_text()
          insertion = '''\n\n  it("refuses to seal while a semantic planning read is in flight", async () => {\n    let release!: () => void;\n    const wait = new Promise<void>((resolve) => { release = resolve; });\n    const contract: PlanningReadContractV1 = {\n      readContractId: "deferred.read.v1",\n      readContractVersion: 1,\n      maxCanonicalArgsBytes: 1024,\n      maxCanonicalResultBytes: 1024,\n      normalizeArgs: (input) => input,\n      execute: async () => {\n        await wait;\n        return { result: { value: "observed" }, complete: true, coverageIdentity: "deferred-v1" };\n      },\n    };\n    const registry = new PlanningReadRegistry("planning-local-v1", 1, [contract]);\n    const tracker = registry.track("workspace-1");\n    const pending = tracker.read("deferred.read.v1", 1, { key: "value" });\n\n    expect(() => tracker.seal()).toThrow(/in flight/);\n    release();\n    await expect(pending).resolves.toEqual({ value: "observed" });\n    expect(tracker.seal().dependencies).toHaveLength(1);\n  });\n'''
          text = replace_once(text, '\n});\n', insertion + '\n});\n', "planning in-flight regression test")
          path.write_text(text)

          # 4) Program creation tests: persist a caller objective event and pass Host-issued trackers.
          path = Path("packages/host-runtime/src/program-creation.test.ts")
          text = path.read_text()
          text = replace_once(
              text,
              'import { join } from "node:path";\n',
              'import { join } from "node:path";\nimport { asWorkspaceId, mkEventId, type SessionId } from "@alcode/events";\n',
              "program creation test event imports",
          )
          helper_test = '''\nasync function appendObjectiveEvent(\n  admission: CanonicalAdmissionQueue,\n  workspaceId: string,\n  sessionId: SessionId,\n  objective: string,\n): Promise<string> {\n  const eventId = mkEventId();\n  const timestamp = Date.now();\n  await admission.append([{\n    eventId,\n    workspaceId: asWorkspaceId(workspaceId),\n    sessionId,\n    occurredAt: new Date(timestamp).toISOString(),\n    type: "user.message.appended",\n    payload: { text: objective, timestamp },\n    payloadSchemaVersion: 1,\n    producer: { kind: "user" },\n  }]);\n  return String(eventId);\n}\n'''
          text = replace_once(text, '\nasync function allEvents(', helper_test + '\nasync function allEvents(', "program creation objective event helper")
          text = text.replace('new TrackedPlanningReads(registry, locked.store.workspaceId)', 'registry.track(locked.store.workspaceId)')
          text = text.replace('    const planningIdentity = tracker.seal();\n\n', '')
          text = text.replace('      proposal: proposal(),\n      planningObservationIdentity: planningIdentity,\n', '      proposal: programProposal,\n      planningReads: tracker,\n      sourceObjectiveEventId,\n', 1)
          # First test needs proposal/event declarations immediately before sealing.
          needle = '    const draft = await service.sealDraft({\n      sourceSessionId: session.sessionId,\n      proposal: programProposal,\n'
          text = replace_once(
              text,
              needle,
              '    const programProposal = proposal();\n    const sourceObjectiveEventId = await appendObjectiveEvent(\n      admission, locked.store.workspaceId, session.sessionId, programProposal.objective,\n    );\n    const draft = await service.sealDraft({\n      sourceSessionId: session.sessionId,\n      proposal: programProposal,\n',
              "first program creation objective setup",
          )
          # Remaining sealDraft calls still use the old identity expression.
          text = text.replace('      proposal: proposal(),\n      planningObservationIdentity: tracker.seal(),\n', '      proposal: programProposal,\n      planningReads: tracker,\n      sourceObjectiveEventId,\n')
          # Add proposal/event setup before the second and third draft declarations.
          marker2 = '    const draft = await service.sealDraft({\n      sourceSessionId: session.sessionId,\n      proposal: programProposal,\n      planningReads: tracker,\n      sourceObjectiveEventId,\n    });\n'
          occurrences = text.count(marker2)
          if occurrences != 3:
              raise SystemExit(f"expected 3 normalized draft blocks, found {occurrences}")
          # The first already has setup. Inject setup before the second and third by walking occurrences.
          parts = text.split(marker2)
          rebuilt = parts[0] + marker2
          for idx in range(1, len(parts) - 1):
              if idx >= 1:
                  rebuilt += '    const programProposal = proposal();\n    const sourceObjectiveEventId = await appendObjectiveEvent(\n      admission, locked.store.workspaceId, session.sessionId, programProposal.objective,\n    );\n'
              rebuilt += parts[idx] + marker2
          rebuilt += parts[-1]
          # The split strategy injects setup after prior block rather than directly before next when idx=1;
          # normalize accidental placement by replacing the known transition sequence.
          text = rebuilt
          path.write_text(text)

          # 5) Binding regressions: unissued tracker rejected, objective event must match, completion remains blocked.
          path = Path("packages/host-runtime/src/program-creation-binding.test.ts")
          text = path.read_text()
          text = replace_once(
              text,
              'import { join } from "node:path";\n',
              'import { join } from "node:path";\nimport { asWorkspaceId, mkEventId, type SessionId } from "@alcode/events";\n',
              "binding test event imports",
          )
          text = replace_once(
              text,
              '  ProgramCreationServiceV1,\n',
              '  ProgramCreationServiceV1,\n  ProgramCreationStaleError,\n',
              "binding stale error import",
          )
          helper_binding = '''\nasync function appendObjectiveEvent(\n  admission: CanonicalAdmissionQueue,\n  workspaceId: string,\n  sessionId: SessionId,\n  objective: string,\n): Promise<string> {\n  const eventId = mkEventId();\n  const timestamp = Date.now();\n  await admission.append([{\n    eventId,\n    workspaceId: asWorkspaceId(workspaceId),\n    sessionId,\n    occurredAt: new Date(timestamp).toISOString(),\n    type: "user.message.appended",\n    payload: { text: objective, timestamp },\n    payloadSchemaVersion: 1,\n    producer: { kind: "user" },\n  }]);\n  return String(eventId);\n}\n'''
          text = replace_once(text, '\nasync function replayTypes(', helper_binding + '\nasync function replayTypes(', "binding objective helper")
          old_setup = '''    const registry = new PlanningReadRegistry("planning-empty-v1", 1, []);\n    const identity = new TrackedPlanningReads(registry, locked.store.workspaceId).seal();\n    const service = new ProgramCreationServiceV1({\n      store: locked.store,\n      admission,\n      planningReads: registry,\n      planningBarrier: barrier,\n      policy,\n      executionObservationProfiles: executionProfiles,\n    });\n\n    await service.sealDraft({\n      sourceSessionId: session.sessionId,\n      proposal: proposal(),\n      planningObservationIdentity: identity,\n    });\n\n    await expect(service.sealDraft({\n      sourceSessionId: session.sessionId,\n      proposal: proposal(),\n      planningObservationIdentity: identity,\n    })).rejects.toBeInstanceOf(ProgramCreationControlError);\n'''
          new_setup = '''    const registry = new PlanningReadRegistry("planning-empty-v1", 1, []);\n    const service = new ProgramCreationServiceV1({\n      store: locked.store,\n      admission,\n      planningReads: registry,\n      planningBarrier: barrier,\n      policy,\n      executionObservationProfiles: executionProfiles,\n    });\n    const programProposal = proposal();\n    const sourceObjectiveEventId = await appendObjectiveEvent(\n      admission, locked.store.workspaceId, session.sessionId, programProposal.objective,\n    );\n\n    const unissued = new TrackedPlanningReads(registry, locked.store.workspaceId);\n    await expect(service.sealDraft({\n      sourceSessionId: session.sessionId,\n      proposal: programProposal,\n      planningReads: unissued,\n      sourceObjectiveEventId,\n    })).rejects.toBeInstanceOf(ProgramCreationControlError);\n\n    const alteredTracker = registry.track(locked.store.workspaceId);\n    await expect(service.sealDraft({\n      sourceSessionId: session.sessionId,\n      proposal: { ...programProposal, objective: "Agent-altered objective" },\n      planningReads: alteredTracker,\n      sourceObjectiveEventId,\n    })).rejects.toBeInstanceOf(ProgramCreationStaleError);\n\n    const tracker = registry.track(locked.store.workspaceId);\n    await service.sealDraft({\n      sourceSessionId: session.sessionId,\n      proposal: programProposal,\n      planningReads: tracker,\n      sourceObjectiveEventId,\n    });\n\n    const secondTracker = registry.track(locked.store.workspaceId);\n    await expect(service.sealDraft({\n      sourceSessionId: session.sessionId,\n      proposal: programProposal,\n      planningReads: secondTracker,\n      sourceObjectiveEventId,\n    })).rejects.toBeInstanceOf(ProgramCreationControlError);\n'''
          text = replace_once(text, old_setup, new_setup, "binding source/issuance regressions")
          path.write_text(text)
          PY
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck Host runtime
        run: pnpm --filter @alcode/host-runtime typecheck
      - name: Test Host runtime
        run: pnpm --filter @alcode/host-runtime test
      - name: Commit review corrections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/host-runtime/src/planning-read.ts \
                  packages/host-runtime/src/planning-read.test.ts \
                  packages/host-runtime/src/program-creation.ts \
                  packages/host-runtime/src/program-creation.test.ts \
                  packages/host-runtime/src/program-creation-binding.test.ts
          git commit -m "fix(1.0): bind Program creation to Host provenance"
          git push origin HEAD:feat/phase-1.0-program-creation
