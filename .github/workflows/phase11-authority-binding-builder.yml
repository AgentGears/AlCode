name: Phase 1.1 authority binding builder

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: github.head_ref == 'automation/phase11-authority-binding-pr-builder'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare clean feature branch
        run: |
          cp .automation/phase11-authority-binding.py /tmp/phase11-authority-binding.py
          git fetch origin main
          git switch -C feat/phase-1.1-inference-authority origin/main
      - name: Apply frozen authority-binding correction
        run: python /tmp/phase11-authority-binding.py
      - name: Normalize generated type-only import
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('extensions/cognition/src/proxy-tools.ts')
          text = p.read_text()
          old = '  HostToAgentMessage,\n  type ProgramAttemptAuthorityV1,\n  ProtocolTransport,'
          new = '  HostToAgentMessage,\n  ProgramAttemptAuthorityV1,\n  ProtocolTransport,'
          if text.count(old) != 1:
              raise SystemExit('expected one generated ProgramAttemptAuthorityV1 import anchor')
          p.write_text(text.replace(old, new, 1))
          PY
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify cognition proxy
        run: pnpm --filter @alcode/cognition-extension typecheck
      - name: Verify coding Agent
        run: |
          pnpm --filter @alcode/coding-agent typecheck
          pnpm --filter @alcode/coding-agent test
      - name: Verify Host authority routing
        run: |
          pnpm --filter @alcode/host-runtime typecheck
          pnpm exec vitest run packages/host-runtime/src
      - name: Commit and publish clean feature branch
        run: |
          git status --short
          git add -A
          git config user.name "ALCODE Automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(1.1): bind Agent capability requests to inference Attempt"
          git push --force origin HEAD:feat/phase-1.1-inference-authority
