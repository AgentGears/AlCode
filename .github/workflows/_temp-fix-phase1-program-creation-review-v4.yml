name: Temporary Phase 1 Program creation review fixes v4

on:
  push:
    branches:
      - feat/phase-1.0-program-creation

permissions:
  contents: write

jobs:
  fix-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-1.0-program-creation
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: pnpm
      - name: Apply bounded review corrections
        run: python3 .github/scripts/_temp_fix_phase1_program_creation.py
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck Host runtime
        run: pnpm --filter @alcode/host-runtime typecheck
      - name: Test Program creation corrections
        run: pnpm exec vitest run packages/host-runtime/src/planning-read.test.ts packages/host-runtime/src/program-creation.test.ts packages/host-runtime/src/program-creation-binding.test.ts
      - name: Commit review corrections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/host-runtime/src/planning-read.ts \
                  packages/host-runtime/src/planning-read.test.ts \
                  packages/host-runtime/src/program-creation.ts \
                  packages/host-runtime/src/program-creation.test.ts \
                  packages/host-runtime/src/program-creation-binding.test.ts
          git commit -m "fix(1.0): bind Program creation to Host provenance"
          git push origin HEAD:feat/phase-1.0-program-creation
