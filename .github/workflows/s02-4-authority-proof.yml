name: S02-4 Authority Proof

on:
  pull_request:
    paths:
      - 'packages/code-mode/**'
      - 'packages/coding-agent/src/inference-runtime.ts'
      - 'packages/coding-agent/src/inference-runtime-s02-3.test.ts'
      - 'packages/coding-agent/src/inference-runtime-s02-4*.test.ts'
      - 'packages/host-runtime/src/program-agent-s02-4.test.ts'
      - 'packages/host-runtime/src/program-adaptive-operation-s02-4*.test.ts'
      - '.github/workflows/s02-4-authority-proof.yml'

permissions:
  contents: read

jobs:
  authority-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck S02-4 boundaries
        run: |
          pnpm --filter @alcode/code-mode exec tsc --noEmit -p tsconfig.json
          pnpm --filter @alcode/coding-agent exec tsc --noEmit -p tsconfig.json
          pnpm --filter @alcode/host-runtime exec tsc --noEmit -p tsconfig.json
      - name: Verify local orchestration authority, replacement, and advisory-return invariants
        run: |
          pnpm exec vitest run \
            packages/code-mode/src/code-mode.test.ts \
            packages/coding-agent/src/inference-runtime-s02-3.test.ts \
            packages/coding-agent/src/inference-runtime-s02-4.test.ts \
            packages/coding-agent/src/inference-runtime-s02-4-replacement.test.ts \
            packages/coding-agent/src/inference-runtime-s02-4-canonical-return.test.ts \
            packages/host-runtime/src/program-agent-s02-4.test.ts \
            packages/host-runtime/src/program-adaptive-operation-s02-4.test.ts \
            packages/host-runtime/src/program-adaptive-operation-s02-4-production.test.ts
