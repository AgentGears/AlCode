name: Temporary Program dispatch review corrections

on:
  push:
    branches:
      - feat/phase-1.0-program-dispatch

permissions:
  contents: write

jobs:
  fix-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-1.0-program-dispatch
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: pnpm
      - name: Apply bounded corrections
        run: python3 .github/scripts/_temp_fix_dispatch_review.py
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck ProgramState
        run: pnpm --filter @alcode/program-state typecheck
      - name: Test ProgramState
        run: pnpm --filter @alcode/program-state test
      - name: Typecheck Host runtime
        run: pnpm --filter @alcode/host-runtime typecheck
      - name: Test dispatch slice
        run: pnpm exec vitest run packages/host-runtime/src/program-dispatch.test.ts
      - name: Commit corrections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/host-runtime/src/program-dispatch.ts packages/host-runtime/src/program-dispatch.test.ts
          git commit -m "fix(1.0): harden Program dispatch currentness"
          git push origin HEAD:feat/phase-1.0-program-dispatch
